name: Package embedded Sandbox bundle
description: 从同轮扫描的不可变镜像生成并上传内置 Sandbox bundle
inputs:
  registry:
    description: 镜像仓库地址
    required: true
  username:
    description: 镜像仓库用户名
    required: true
  password:
    description: 镜像仓库读取凭据
    required: true
  sandbox-image-repository:
    description: Sandbox 镜像仓库
    required: true
  sandbox-image-digest:
    description: 已完成 smoke 和 Trivy 的 Sandbox 镜像 digest
    required: true
runs:
  using: composite
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Install crane for immutable proxy lookup
      shell: bash
      run: |
        version="v0.20.3"
        curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${version}/go-containerregistry_Linux_x86_64.tar.gz" \
          | tar -xz -C /usr/local/bin crane
        crane version

    - name: Pull exact scanned Sandbox image and resolve egress proxy
      id: runtime-images
      shell: bash
      env:
        SANDBOX_IMAGE_REPOSITORY: ${{ inputs.sandbox-image-repository }}
        SANDBOX_DIGEST: ${{ inputs.sandbox-image-digest }}
      run: |
        set -euo pipefail
        [[ "$SANDBOX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
          echo '::error::sandbox job 未提供有效的不可变 digest'; exit 1;
        }
        sandbox_ref="${SANDBOX_IMAGE_REPOSITORY}:embedded-${GITHUB_RUN_ID}"
        docker pull "${SANDBOX_IMAGE_REPOSITORY}@${SANDBOX_DIGEST}"
        docker image tag "${SANDBOX_IMAGE_REPOSITORY}@${SANDBOX_DIGEST}" "$sandbox_ref"

        proxy_digest="$(crane digest ubuntu/squid:latest)"
        [[ "$proxy_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
          echo '::error::egress-proxy registry digest 无效'; exit 1;
        }
        docker pull "ubuntu/squid@${proxy_digest}"
        proxy_ref="ubuntu/squid:embedded-${GITHUB_RUN_ID}"
        docker image tag "ubuntu/squid@${proxy_digest}" "$proxy_ref"
        {
          echo "sandbox_ref=$sandbox_ref"
          echo "proxy_ref=$proxy_ref"
          echo "proxy_digest=$proxy_digest"
        } >> "$GITHUB_OUTPUT"

    - name: Scan immutable egress proxy image
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ steps.runtime-images.outputs.proxy_ref }}
        format: table
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: '1'

    - name: Build embedded runtime bundle
      shell: bash
      env:
        SANDBOX_REF: ${{ steps.runtime-images.outputs.sandbox_ref }}
        SANDBOX_DIGEST: ${{ inputs.sandbox-image-digest }}
        EGRESS_PROXY_REF: ${{ steps.runtime-images.outputs.proxy_ref }}
        EGRESS_PROXY_DIGEST: ${{ steps.runtime-images.outputs.proxy_digest }}
      run: |
        mkdir -p release/embedded-bundle
        python3 scripts/release/build_embedded_sandbox_bundle.py \
          --output release/embedded-bundle/runtime-images.tar \
          --manifest release/embedded-bundle/manifest.json \
          --sandbox-image "$SANDBOX_REF" \
          --sandbox-digest "$SANDBOX_DIGEST" \
          --egress-proxy-image "$EGRESS_PROXY_REF" \
          --egress-proxy-digest "$EGRESS_PROXY_DIGEST"

    - name: Upload embedded runtime bundle
      uses: actions/upload-artifact@v4
      with:
        name: embedded-runtime-bundle-${{ github.run_id }}
        path: release/embedded-bundle/
        if-no-files-found: error
        retention-days: 1
