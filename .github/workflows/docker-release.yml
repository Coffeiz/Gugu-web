name: Docker release

# PR 不再自动触发（省 Actions usage）：合并前人工用 workflow_dispatch 跑一次
# （Actions 页选 PR 分支，或 gh workflow run），全绿再合并，见 docs/ops/release.md §1。
# push main / tags 保留：main 构建部署镜像，tag 触发正式发布（publish job）。
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_REPOSITORY: ghcr.io/coffeiz/gugu-web
  DOCKERHUB_IMAGE_REPOSITORY: docker.io/coffeiz/gugu-web
  DOCKERHUB_BACKEND_IMAGE_REPOSITORY: docker.io/coffeiz/gugu-web-backend
  DOCKERHUB_FRONTEND_IMAGE_REPOSITORY: docker.io/coffeiz/gugu-web-frontend
  SANDBOX_IMAGE_REPOSITORY: ghcr.io/coffeiz/gugu-sandbox
  DOCKERHUB_SANDBOX_IMAGE_REPOSITORY: docker.io/coffeiz/gugu-sandbox
  DOCKER_BUILDKIT: '1'

jobs:
  compose-validate:
    name: Validate Compose files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Compose interpolation
        env:
          GUGU_BACKEND_IMAGE: ghcr.io/coffeiz/gugu-web-backend:ci
          GUGU_FRONTEND_IMAGE: ghcr.io/coffeiz/gugu-web-frontend:ci
          GUGU_DB_PASSWORD: ci-only-database-password
          GUGU_ADMIN_PASSWORD: ci-only-admin-password
        run: |
          touch backend/.env
          GUGU_WEB_IMAGE=coffeiz/gugu-web:ci \
            GUGU_DATA_HOST_DIR=/tmp/gugu-data \
            docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate update manifest schema
        run: node scripts/release/validate-update-manifest.mjs --schema deploy/update-manifest.schema.json

      - name: Test release manifest, image tags and Compose update
        run: >-
          node --test
          scripts/release/validate-update-manifest.test.mjs
          scripts/release/compose-update.test.mjs
          scripts/release/docker-release-tags.test.mjs

  docker-build:
    # 四个镜像按 matrix 并行构建+扫描：墙钟时间 ≈ 最慢单镜像（原串行 ~19 分钟）。
    # CI 在 GitHub 托管 runner（海外）上直连官方源比默认 TUNA（国内镜像）快；
    # APT_MIRROR / PIP_INDEX_URL 只覆盖声明了这些 ARG 的镜像（backend/app/sandbox），
    # 未声明的自动忽略。本地/devserver 构建不传参数，仍走 TUNA 默认。
    name: Build & scan ${{ matrix.name }}
    needs: compose-validate
    runs-on: ubuntu-latest
    # tag 触发时镜像推 :ci-<run_id>，publish 对该 digest 纯复制发布，需要 GHCR 写权限。
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: backend/Dockerfile.prod
            tag: gugu-web-backend:ci
            ci_image: ghcr.io/coffeiz/gugu-web-backend
            cache-scope: backend
            # python slim 自带 ca-certificates，可用 https 官方源
            apt_mirror: https://deb.debian.org
          - name: frontend
            context: .
            dockerfile: frontend/Dockerfile.prod
            tag: gugu-web-frontend:ci
            ci_image: ghcr.io/coffeiz/gugu-web-frontend
            cache-scope: frontend
            apt_mirror: https://deb.debian.org
          - name: app
            context: .
            dockerfile: Dockerfile
            tag: gugu-web:ci
            ci_image: ghcr.io/coffeiz/gugu-web
            cache-scope: default-compose
            # python slim 自带 ca-certificates，可用 https 官方源
            apt_mirror: https://deb.debian.org
          - name: sandbox
            context: docker/sandbox
            dockerfile: docker/sandbox/Dockerfile
            tag: gugu-sandbox:ci
            ci_image: ghcr.io/coffeiz/gugu-sandbox
            cache-scope: sandbox
            # bookworm-slim 内无 ca-certificates（在安装清单里），必须走 http
            apt_mirror: http://deb.debian.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 本地镜像引用：tag 触发时 build 只带全限定 :ci-<run_id> 一个 tag（push+load
      # 双 exporter，本地名即限定名），非 tag 运行仍是非限定 :ci。下方 smoke 与
      # trivy 统一从这里取名字。
      - name: Resolve local image ref
        id: img
        run: echo "ref=${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:ci-{1}', matrix.ci_image, github.run_id) || matrix.tag }}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # tag 触发时推 :ci-<run_id>：publish 对同一 digest 纯复制发布，不再重建——
          # 保证「扫的就是发的」。run_id 隔离同 commit 两个并发运行（main push 与
          # tag push）互相覆盖中间 tag 的竞态。
          # push 模式下 tags 只能放全限定名：非限定名（gugu-web:ci）会被 buildx 推到
          # docker.io/library，而本 job 只登录 GHCR，401 insufficient scopes
          # （v1.2.3 重打 tag 发布事故 2026-09-16）。
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: true
          tags: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:ci-{1}', matrix.ci_image, github.run_id) || matrix.tag }}
          # 沙盒镜像必须每轮全新构建（见下方冒烟注释），其余镜像吃 gha 层缓存。
          no-cache: ${{ matrix.name == 'sandbox' }}
          # 版本 label 必须在构建期带真实 tag：publish 复制不改内容，updater 靠
          # org.opencontainers.image.version 识别当前版本。
          build-args: |
            APT_MIRROR=${{ matrix.apt_mirror }}
            PIP_INDEX_URL=https://pypi.org/simple
            GUGU_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-ci' }}
            GUGU_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

      # 沙盒镜像不走构建层缓存：apt 层一旦命中旧缓存，apt-get upgrade 不会真跑，
      # 镜像里就是旧包，而 trivy 漏洞库每次都是最新，必然假红（linux-libc-dev
      # 6.1.180-1 vs 6.1.187-1 案例 2026-09-10）。Dockerfile 内的 apt 下载 cache
      # mount 不受此限：软件源索引每轮照拉、upgrade 照跑，只复用未变版本的 .deb 下载。
      - name: Smoke test Shell sandbox runtime
        if: matrix.name == 'sandbox'
        run: |
          docker run --rm --entrypoint bash ${{ steps.img.outputs.ref }} -lc '
            set -eu
            python --version
            node --version
            npm --version
            ffmpeg -version | head -n 1
            git --version
            python -c "import matplotlib, PIL; matplotlib.use(\"Agg\"); import matplotlib.pyplot as plt; plt.plot([0, 1], [0, 1]); plt.savefig(\"/tmp/sandbox-smoke.png\")"
            test -s /tmp/sandbox-smoke.png
          '

      - name: Smoke test TS RAG worker
        if: matrix.name == 'app'
        run: docker run --rm --entrypoint node ${{ steps.img.outputs.ref }} bin/gugu-rag-ts-worker.mjs --version

      - name: Smoke test updater toolchain in app image
        if: matrix.name == 'app'
        run: |
          docker run --rm --entrypoint python3 ${{ steps.img.outputs.ref }} -c 'import updater.daemon'
          docker run --rm --entrypoint docker ${{ steps.img.outputs.ref }} compose version

      # 安全门扫本地加载的镜像（真实文件系统）：不要扫 registry 引用——trivy 会自动
      # 发现并优先消费 registry 侧可关联的第三方 SBOM referrer，历史构建残留的过期
      # SBOM 会导致误报已修复的漏洞（v1.0.2 曾因此报 msgpack 1.1.2/setuptools 70.3.0，
      # 而镜像实际为 1.2.2/84.0.0）。本地 daemon 镜像不涉及 referrer 发现。
      # skip-files：pip 自带 vendored SBOM（bom.cdx.json），记录的是 pip 内部依赖
      # （msgpack 1.1.2/setuptools 70.3.0），并非应用实际安装的包（1.2.2/84.0.0，
      # 构建断言保证）。trivy 会把它当语言专用清单解析成 python-pkg 目标并误报漏洞。
      - name: Scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-files: ${{ (matrix.name == 'backend' || matrix.name == 'app') && '/opt/venv/lib/python3.14/site-packages/pip/_vendor/bom.cdx.json,/usr/local/lib/python3.14/site-packages/pip/_vendor/bom.cdx.json' || '' }}

  publish:
    name: Publish Docker Hub app and GHCR business images
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [compose-validate, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo '::error::版本 tag 必须符合 v<major>.<minor>.<patch>'; exit 1;
          }
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'is_stable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_stable=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install crane
        run: |
          version="v0.20.3"
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${version}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin crane
          crane version

      # 不再重建镜像：docker-build 已把本轮被 trivy 扫描过的镜像推到
      # :ci-<run_id>，这里对同一 digest 纯复制到发布 tag——扫的就是发的。
      # 同仓（GHCR）blob 已存在、秒级完成；跨仓到 Docker Hub 只传层不执行构建。
      - name: Copy CI images to release tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CI_SUFFIX: ci-${{ github.run_id }}
        run: |
          set -euo pipefail
          crane copy "${REGISTRY}/coffeiz/gugu-web-backend:${CI_SUFFIX}" "${REGISTRY}/coffeiz/gugu-web-backend:${VERSION}"
          crane copy "${REGISTRY}/coffeiz/gugu-web-backend:${CI_SUFFIX}" "docker.io/coffeiz/gugu-web-backend:${VERSION}"
          crane copy "${REGISTRY}/coffeiz/gugu-web-frontend:${CI_SUFFIX}" "${REGISTRY}/coffeiz/gugu-web-frontend:${VERSION}"
          crane copy "${REGISTRY}/coffeiz/gugu-web-frontend:${CI_SUFFIX}" "docker.io/coffeiz/gugu-web-frontend:${VERSION}"
          crane copy "${REGISTRY}/coffeiz/gugu-web:${CI_SUFFIX}" "${REGISTRY}/coffeiz/gugu-web:${VERSION}"
          crane copy "${REGISTRY}/coffeiz/gugu-web:${CI_SUFFIX}" "docker.io/coffeiz/gugu-web:${VERSION}"
          crane copy "${REGISTRY}/coffeiz/gugu-sandbox:${CI_SUFFIX}" "${REGISTRY}/coffeiz/gugu-sandbox:${VERSION}"
          crane copy "${REGISTRY}/coffeiz/gugu-sandbox:${CI_SUFFIX}" "docker.io/coffeiz/gugu-sandbox:${VERSION}"

      - name: Resolve release digests
        id: digests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "ghcr_backend=$(crane digest "${IMAGE_REPOSITORY}-backend:${VERSION}")"
            echo "ghcr_frontend=$(crane digest "${IMAGE_REPOSITORY}-frontend:${VERSION}")"
            echo "ghcr_app=$(crane digest "${IMAGE_REPOSITORY}:${VERSION}")"
            echo "ghcr_sandbox=$(crane digest "${SANDBOX_IMAGE_REPOSITORY}:${VERSION}")"
            echo "hub_backend=$(crane digest "${DOCKERHUB_BACKEND_IMAGE_REPOSITORY}:${VERSION}")"
            echo "hub_frontend=$(crane digest "${DOCKERHUB_FRONTEND_IMAGE_REPOSITORY}:${VERSION}")"
            echo "hub_app=$(crane digest "${DOCKERHUB_IMAGE_REPOSITORY}:${VERSION}")"
            echo "hub_sandbox=$(crane digest "${DOCKERHUB_SANDBOX_IMAGE_REPOSITORY}:${VERSION}")"
          } >> "$GITHUB_OUTPUT"

      - name: Tag stable images as latest
        if: steps.version.outputs.is_stable == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          crane tag "${IMAGE_REPOSITORY}:${VERSION}" latest
          crane tag "${DOCKERHUB_IMAGE_REPOSITORY}:${VERSION}" latest
          crane tag "${SANDBOX_IMAGE_REPOSITORY}:${VERSION}" latest
          crane tag "${DOCKERHUB_SANDBOX_IMAGE_REPOSITORY}:${VERSION}" latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign immutable image references
        env:
          BACKEND_DIGEST: ${{ steps.digests.outputs.hub_backend }}
          FRONTEND_DIGEST: ${{ steps.digests.outputs.hub_frontend }}
          APP_DIGEST: ${{ steps.digests.outputs.hub_app }}
          SANDBOX_DIGEST: ${{ steps.digests.outputs.hub_sandbox }}
        run: |
          cosign sign --yes --registry-referrers-mode=oci-1-1 "${IMAGE_REPOSITORY}-backend@${{ steps.digests.outputs.ghcr_backend }}"
          cosign sign --yes --registry-referrers-mode=oci-1-1 "${DOCKERHUB_BACKEND_IMAGE_REPOSITORY}@${BACKEND_DIGEST}"
          cosign sign --yes --registry-referrers-mode=oci-1-1 "${IMAGE_REPOSITORY}-frontend@${{ steps.digests.outputs.ghcr_frontend }}"
          cosign sign --yes --registry-referrers-mode=oci-1-1 "${DOCKERHUB_FRONTEND_IMAGE_REPOSITORY}@${FRONTEND_DIGEST}"
          cosign sign --yes --registry-referrers-mode=oci-1-1 "${IMAGE_REPOSITORY}@${{ steps.digests.outputs.ghcr_app }}"
          cosign sign --yes --registry-referrers-mode=oci-1-1 "${DOCKERHUB_IMAGE_REPOSITORY}@${APP_DIGEST}"
          cosign sign --yes --registry-referrers-mode=oci-1-1 "${SANDBOX_IMAGE_REPOSITORY}@${{ steps.digests.outputs.ghcr_sandbox }}"
          cosign sign --yes --registry-referrers-mode=oci-1-1 "${DOCKERHUB_SANDBOX_IMAGE_REPOSITORY}@${SANDBOX_DIGEST}"

      - name: 同步 Docker Hub Overview
        if: steps.version.outputs.is_stable == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: coffeiz/gugu-web
          short-description: Gugu Agent UI：项目、文件、日历与 Agent 沙盒。
          readme-filepath: ./docs/quick-deploy.md
          enable-url-completion: true

      # 安全门已前移到 docker-build job（扫本地加载镜像的真实文件系统）。
      # 此处不扫 registry 引用：trivy 会优先消费 registry 侧可关联的第三方 SBOM
      # referrer，历史构建残留的过期 SBOM 会导致误报（见 docker-build 内注释）。

      - name: Generate update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP_DIGEST: ${{ steps.digests.outputs.hub_app }}
          GIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p release
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ['VERSION']
          manifest = {
              'schema_version': 2,
              'version': version,
              'channel': 'stable',
              'minimum_version': '0.22.0',
              'app_image': f"docker.io/coffeiz/gugu-web@{os.environ['APP_DIGEST']}",
              'architectures': ['linux/amd64'],
              'database_migration': True,
              'release_notes_url': f"https://github.com/Coffeiz/Gugu-web/releases/tag/{version}",
              'rollback_supported': True,
              'git_sha': os.environ['GIT_SHA'],
              'published_at': datetime.now(timezone.utc).isoformat(),
          }
          Path('release/update-manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n'
          )
          PY

      - name: Validate generated update manifest
        run: node scripts/release/validate-update-manifest.mjs release/update-manifest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          # Release 可能已手动创建（如提前按 CHANGELOG 发）或上次运行已建过；
          # 幂等处理：已存在只补传 manifest 附件，不存在才新建。
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/update-manifest.json --clobber
          else
            gh release create "$TAG" release/update-manifest.json \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Write release summary
        env:
          TAG: ${{ steps.version.outputs.version }}
          BACKEND_DIGEST: ${{ steps.digests.outputs.hub_backend }}
          FRONTEND_DIGEST: ${{ steps.digests.outputs.hub_frontend }}
          APP_DIGEST: ${{ steps.digests.outputs.hub_app }}
          SANDBOX_DIGEST: ${{ steps.digests.outputs.hub_sandbox }}
        run: |
          {
            echo '### Docker 发布完成'
            echo "- 版本：$TAG"
            echo "- backend digest：$BACKEND_DIGEST"
            echo "- frontend digest：$FRONTEND_DIGEST"
            echo "- default Compose app digest：$APP_DIGEST"
            echo "- sandbox digest：$SANDBOX_DIGEST"
            echo '- 架构：linux/amd64'
            echo '- 镜像来源：docker-build 推送的 :ci-<run_id> digest 纯复制（扫的即发的）'
            echo '- manifest：GitHub Release 资产'
          } >> "$GITHUB_STEP_SUMMARY"
