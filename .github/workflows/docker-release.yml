name: Docker release

# PR 不再自动触发（省 Actions usage）：合并前人工用 workflow_dispatch 跑一次
# （Actions 页选 PR 分支，或 gh workflow run），全绿再合并，见 docs/ops/release.md §1。
# push main / tags 保留：main 构建部署镜像，tag 触发正式发布（publish job）。
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_REPOSITORY: ghcr.io/coffeiz/gugu-web
  DOCKERHUB_IMAGE_REPOSITORY: docker.io/coffeiz/gugu-web
  DOCKER_BUILDKIT: '1'

jobs:
  compose-validate:
    name: Validate Compose files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Compose interpolation
        env:
          GUGU_BACKEND_IMAGE: ghcr.io/coffeiz/gugu-web-backend:ci
          GUGU_FRONTEND_IMAGE: ghcr.io/coffeiz/gugu-web-frontend:ci
          GUGU_DB_PASSWORD: ci-only-database-password
          GUGU_ADMIN_PASSWORD: ci-only-admin-password
        run: |
          touch backend/.env
          GUGU_WEB_IMAGE=coffeiz/gugu-web:ci \
            GUGU_DATA_HOST_DIR=/tmp/gugu-data \
            docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate update manifest schema
        run: node scripts/release/validate-update-manifest.mjs --schema deploy/update-manifest.schema.json

  docker-build:
    name: Build production images
    needs: compose-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.prod
          platforms: linux/amd64
          push: false
          load: true
          tags: gugu-web-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile.prod
          platforms: linux/amd64
          push: false
          load: true
          tags: gugu-web-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build default Compose image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: gugu-web:ci
          cache-from: type=gha,scope=default-compose
          cache-to: type=gha,mode=max,scope=default-compose

      - name: Smoke test TS RAG worker
        run: docker run --rm --entrypoint node gugu-web:ci bin/gugu-rag-ts-worker.mjs --version

      # 安全门扫本地加载的镜像（真实文件系统）：不要扫 registry 引用——trivy 会自动
      # 发现并优先消费 registry 侧可关联的第三方 SBOM referrer，历史构建残留的过期
      # SBOM 会导致误报已修复的漏洞（v1.0.2 曾因此报 msgpack 1.1.2/setuptools 70.3.0，
      # 而镜像实际为 1.2.2/84.0.0）。本地 daemon 镜像不涉及 referrer 发现。
      # skip-files：pip 自带 vendored SBOM（bom.cdx.json），记录的是 pip 内部依赖
      # （msgpack 1.1.2/setuptools 70.3.0），并非应用实际安装的包（1.2.2/84.0.0，
      # 构建断言保证）。trivy 会把它当语言专用清单解析成 python-pkg 目标并误报漏洞。
      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gugu-web-backend:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-files: /usr/local/lib/python3.14/site-packages/pip/_vendor/bom.cdx.json

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gugu-web-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan default Compose image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gugu-web:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          # 默认一体化镜像把 Python 依赖安装在 /opt/venv；排除 pip 自带的
          # vendored SBOM，避免把其中记录的旧版本误判为应用依赖。
          skip-files: /opt/venv/lib/python3.14/site-packages/pip/_vendor/bom.cdx.json

  publish:
    name: Publish GHCR and Docker Hub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [compose-validate, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo '::error::版本 tag 必须符合 v<major>.<minor>.<patch>'; exit 1;
          }
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'is_stable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_stable=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        id: backend-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}-backend:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_REPOSITORY }}-backend:${{ github.sha }}
            ${{ env.DOCKERHUB_IMAGE_REPOSITORY }}-backend:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_IMAGE_REPOSITORY }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: mode=max
          # 不再附加 SBOM attestation：buildx 的 SBOM 生成结果会被 gha cache 缓存，
          # 依赖层更新后可能仍是旧内容，trivy 扫描会优先读取 attestation 里的过期
          # 包清单，导致发布扫描误报已修复的漏洞（如 msgpack 1.1.2）。

      - name: Build and push frontend image
        id: frontend-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}-frontend:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_REPOSITORY }}-frontend:${{ github.sha }}
            ${{ env.DOCKERHUB_IMAGE_REPOSITORY }}-frontend:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_IMAGE_REPOSITORY }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: mode=max
          # 不再附加 SBOM attestation：buildx 的 SBOM 生成结果会被 gha cache 缓存，
          # 依赖层更新后可能仍是旧内容，trivy 扫描会优先读取 attestation 里的过期
          # 包清单，导致发布扫描误报已修复的漏洞（如 msgpack 1.1.2）。

      - name: Build and push default Compose image
        id: app-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.DOCKERHUB_IMAGE_REPOSITORY }}:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=default-compose
          cache-to: type=gha,mode=max,scope=default-compose
          provenance: mode=max
          # 不附加 SBOM attestation，避免 gha cache 中的旧清单被发布扫描优先消费。

      - name: Tag stable image as latest
        if: steps.version.outputs.is_stable == 'true'
        env:
          APP_DIGEST: ${{ steps.app-image.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_REPOSITORY}:latest" \
            --tag "${DOCKERHUB_IMAGE_REPOSITORY}:latest" \
            "${IMAGE_REPOSITORY}@${APP_DIGEST}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign immutable image references
        env:
          BACKEND_DIGEST: ${{ steps.backend-image.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend-image.outputs.digest }}
          APP_DIGEST: ${{ steps.app-image.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_REPOSITORY}-backend@${BACKEND_DIGEST}"
          cosign sign --yes "${IMAGE_REPOSITORY}-frontend@${FRONTEND_DIGEST}"
          cosign sign --yes "${DOCKERHUB_IMAGE_REPOSITORY}-backend@${BACKEND_DIGEST}"
          cosign sign --yes "${DOCKERHUB_IMAGE_REPOSITORY}-frontend@${FRONTEND_DIGEST}"
          cosign sign --yes "${IMAGE_REPOSITORY}@${APP_DIGEST}"
          cosign sign --yes "${DOCKERHUB_IMAGE_REPOSITORY}@${APP_DIGEST}"

      # 安全门已前移到 docker-build job（扫本地加载镜像的真实文件系统）。
      # 此处不扫 registry 引用：trivy 会优先消费 registry 侧可关联的第三方 SBOM
      # referrer，历史构建残留的过期 SBOM 会导致误报（见 docker-build 内注释）。

      - name: Generate update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BACKEND_DIGEST: ${{ steps.backend-image.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend-image.outputs.digest }}
          GIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p release
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ['VERSION']
          manifest = {
              'schema_version': 1,
              'version': version,
              'channel': 'stable',
              'minimum_version': '0.22.0',
              'backend_image': f"ghcr.io/coffeiz/gugu-web-backend@{os.environ['BACKEND_DIGEST']}",
              'frontend_image': f"ghcr.io/coffeiz/gugu-web-frontend@{os.environ['FRONTEND_DIGEST']}",
              'architectures': ['linux/amd64'],
              'database_migration': True,
              'release_notes_url': f"https://github.com/Coffeiz/Gugu-web/releases/tag/{version}",
              'rollback_supported': True,
              'git_sha': os.environ['GIT_SHA'],
              'published_at': datetime.now(timezone.utc).isoformat(),
          }
          Path('release/update-manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n'
          )
          PY

      - name: Validate generated update manifest
        run: node scripts/release/validate-update-manifest.mjs release/update-manifest.json

      - name: Sign update manifest
        run: |
          cosign sign-blob --yes \
            --bundle release/update-manifest.json.bundle \
            release/update-manifest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          # Release 可能已手动创建（如提前按 CHANGELOG 发）或上次运行已建过；
          # 幂等处理：已存在只补传 manifest 附件，不存在才新建。
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" \
              release/update-manifest.json \
              release/update-manifest.json.bundle --clobber
          else
            gh release create "$TAG" \
              release/update-manifest.json \
              release/update-manifest.json.bundle \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Write release summary
        env:
          TAG: ${{ steps.version.outputs.version }}
          BACKEND_DIGEST: ${{ steps.backend-image.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend-image.outputs.digest }}
          APP_DIGEST: ${{ steps.app-image.outputs.digest }}
        run: |
          {
            echo '### Docker 发布完成'
            echo "- 版本：$TAG"
            echo "- backend digest：$BACKEND_DIGEST"
            echo "- frontend digest：$FRONTEND_DIGEST"
            echo "- default Compose app digest：$APP_DIGEST"
            echo '- 架构：linux/amd64'
            echo '- manifest：GitHub Release 资产'
          } >> "$GITHUB_STEP_SUMMARY"
