name: Runtime integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'package-lock.json'
      - '.github/workflows/runtime-integration.yml'

permissions:
  contents: read

env:
  RUNTIME_REPOSITORY: Coffeiz/Gugu-interaction-runtime
  RUNTIME_COMMIT: 4f1f39f7df88e5c4ccd0094af792071b08768da1

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gugu-web
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Runtime repository token
        env:
          RUNTIME_TOKEN: ${{ secrets.RUNTIME_REPO_TOKEN }}
        run: test -n "$RUNTIME_TOKEN" || { echo '::error::RUNTIME_REPO_TOKEN 未配置'; exit 1; }

      - name: Checkout pinned Runtime
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RUNTIME_REPOSITORY }}
          ref: ${{ env.RUNTIME_COMMIT }}
          path: gugu-interaction-runtime
          token: ${{ secrets.RUNTIME_REPO_TOKEN }}
          persist-credentials: false

      - name: Recreate local sibling layout
        run: ln -s "$GITHUB_WORKSPACE/gugu-interaction-runtime" "$GITHUB_WORKSPACE/../gugu-interaction-runtime"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Strict typecheck
        working-directory: frontend
        run: npm run typecheck:strict

      - name: Unit tests
        working-directory: frontend
        run: npm run test:run

      - name: Build
        working-directory: frontend
        run: npm run build

  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Runtime repository token
        env:
          RUNTIME_TOKEN: ${{ secrets.RUNTIME_REPO_TOKEN }}
        run: test -n "$RUNTIME_TOKEN" || { echo '::error::RUNTIME_REPO_TOKEN 未配置'; exit 1; }

      - name: Checkout pinned Runtime
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RUNTIME_REPOSITORY }}
          ref: ${{ env.RUNTIME_COMMIT }}
          path: gugu-interaction-runtime
          token: ${{ secrets.RUNTIME_REPO_TOKEN }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gugu-interaction-runtime/package-lock.json

      - name: Install Runtime dependencies
        working-directory: gugu-interaction-runtime
        run: npm install --no-audit --no-fund

      - name: Runtime typecheck
        working-directory: gugu-interaction-runtime
        run: npm run typecheck

      - name: Runtime tests
        working-directory: gugu-interaction-runtime
        run: npm run test

      - name: Runtime build
        working-directory: gugu-interaction-runtime
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gugu-web
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Python compileall
        working-directory: backend
        run: python -m compileall -q app agent

      - name: Backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Ownership guard
        run: python backend/scripts/check_ownership.py

      - name: Confirmation gate guard
        run: python backend/scripts/check_confirm_gate.py
