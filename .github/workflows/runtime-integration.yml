name: Runtime integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/**'
      - 'package-lock.json'
      - '.github/workflows/runtime-integration.yml'

permissions:
  contents: read

env:
  RUNTIME_REPOSITORY: Coffeiz/Gugu-interaction-runtime
  RUNTIME_COMMIT: 4f1f39f7df88e5c4ccd0094af792071b08768da1

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gugu-web
        uses: actions/checkout@v4

      - name: Checkout pinned Runtime
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RUNTIME_REPOSITORY }}
          ref: ${{ env.RUNTIME_COMMIT }}
          path: gugu-interaction-runtime
          token: ${{ secrets.RUNTIME_REPO_TOKEN || github.token }}

      - name: Recreate local sibling layout
        run: ln -s "$GITHUB_WORKSPACE/gugu-interaction-runtime" "$GITHUB_WORKSPACE/../gugu-interaction-runtime"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm run test:run

      - name: Build
        working-directory: frontend
        run: npm run build
