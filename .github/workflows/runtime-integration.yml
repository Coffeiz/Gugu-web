name: Runtime integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUNTIME_REPOSITORY: Coffeiz/Gugu-interaction-runtime

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_USE_LOCAL_RUNTIME: '1'
    steps:
      - name: Checkout Gugu-web
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read pinned Runtime commit
        run: echo "RUNTIME_COMMIT=$(tr -d '[:space:]' < .runtime-version)" >> "$GITHUB_ENV"

      - name: Checkout pinned Runtime
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RUNTIME_REPOSITORY }}
          ref: ${{ env.RUNTIME_COMMIT }}
          path: gugu-interaction-runtime
          persist-credentials: false

      - name: Recreate local sibling layout
        run: ln -s "$GITHUB_WORKSPACE/gugu-interaction-runtime" "$GITHUB_WORKSPACE/../gugu-interaction-runtime"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 集成 job 通过 VITE_USE_LOCAL_RUNTIME=1 显式验证 pinned Runtime 构建产物；
      # 普通/生产构建使用 frontend/package.json 中的 npm Runtime 包。
      - name: Install Runtime dependencies for integration alias
        working-directory: gugu-interaction-runtime
        run: npm ci --no-audit --no-fund

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Strict typecheck
        working-directory: frontend
        run: npm run typecheck:strict

      - name: Unit tests
        working-directory: frontend
        run: npm run test:run

      - name: Test metadata and boundaries
        run: |
          node scripts/tests/check-test-metadata.mjs
          node scripts/tests/check-test-boundaries.mjs

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Failure classification summary
        if: failure()
        run: |
          {
            echo '### CI 失败分类'
            echo '- 环境失败：依赖安装、Runtime checkout 或构建环境步骤。'
            echo '- 代码/测试失败：类型检查、单元测试或构建步骤。'
            echo '- 测试分类错误：测试元数据或边界检查步骤。'
          } >> "$GITHUB_STEP_SUMMARY"

  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gugu-web
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read pinned Runtime commit
        run: echo "RUNTIME_COMMIT=$(tr -d '[:space:]' < .runtime-version)" >> "$GITHUB_ENV"

      - name: Checkout pinned Runtime
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RUNTIME_REPOSITORY }}
          ref: ${{ env.RUNTIME_COMMIT }}
          path: gugu-interaction-runtime
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gugu-interaction-runtime/package-lock.json

      - name: Install Runtime dependencies
        working-directory: gugu-interaction-runtime
        run: npm ci --no-audit --no-fund

      - name: Runtime typecheck
        working-directory: gugu-interaction-runtime
        run: npm run typecheck

      - name: Runtime tests
        working-directory: gugu-interaction-runtime
        run: npm run test

      - name: Runtime build
        working-directory: gugu-interaction-runtime
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    # 后端完整 pytest 覆盖依赖真实 PostgreSQL/Redis；RAG 测试另行构建 TS worker。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pm
          POSTGRES_PASSWORD: pm123
          POSTGRES_DB: gugu_web
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pm -d gugu_web"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DB__HOST: 127.0.0.1
      DB__PORT: 5432
      DB__NAME: gugu_web
      DB__USER: pm
      DB__PASSWORD: pm123
      REDIS__HOST: 127.0.0.1
      REDIS__PORT: 6379
      STORAGE__BACKEND: local
      SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - name: Checkout Gugu-web
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Create backend virtual environment
        working-directory: backend
        run: python -m venv .venv

      - name: Install backend dependencies
        working-directory: backend
        run: .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Setup Node and build RAG worker
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install RAG worker dependencies
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate && pnpm install --filter gugu-rag-ts-worker... --frozen-lockfile

      - name: Expose RAG worker runtime dependencies
        # 制品输出在 backend/bin；把 wrapper 和 Linux 原生包直接安装到制品旁边，
        # 避免依赖 pnpm workspace 的符号链接层级。
        run: |
          mkdir -p "$GITHUB_WORKSPACE/backend/bin/node_modules"
          npm install --prefix "$GITHUB_WORKSPACE/backend/bin" --no-save --include=optional \
            --ignore-scripts --no-fund --no-audit \
            @node-rs/jieba@2.0.1 @node-rs/jieba-linux-x64-gnu@2.0.1

      - name: Build RAG worker
        run: pnpm --filter gugu-rag-ts-worker build

      - name: RAG worker smoke test
        working-directory: backend
        run: |
          printf '%s\n' '{"op":"tokenize","text":"部署上线"}' | node bin/gugu-rag-ts-worker.mjs > /tmp/rag-worker-smoke.jsonl
          node -e "const fs = require('fs'); const line = fs.readFileSync('/tmp/rag-worker-smoke.jsonl', 'utf8').trim(); const result = JSON.parse(line); if (result.status !== 'ok' || !Array.isArray(result.tokens) || result.tokens.length === 0) { throw new Error('RAG worker smoke test failed: ' + line) }"

      - name: Install frontend dependencies for affected tests
        if: github.event_name == 'pull_request'
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Create database schema
        working-directory: backend
        env:
          PYTHONPATH: .
        run: .venv/bin/python -c "import asyncio; from app.db.session import create_all_tables; asyncio.run(create_all_tables())"

      - name: Python compileall
        working-directory: backend
        run: python -m compileall -q app agent

      - name: Backend tests (代码/测试分类)
        working-directory: backend
        env:
          PYTHONPATH: .
        run: .venv/bin/python -m pytest -q

      - name: Affected L1 tests (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA...HEAD")
          if printf '%s\n' "$changed" | grep -q '^backend/'; then
            node scripts/tests/run-affected-tests.mjs --base="$BASE_SHA"
          else
            echo '本次 PR 未修改 backend，跳过后端受影响 L1。'
          fi

      - name: Ownership guard
        run: python backend/scripts/check_ownership.py

      - name: Confirmation gate guard
        run: python backend/scripts/check_confirm_gate.py

      - name: ORM boundary ratchet
        env:
          ORM_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${ORM_BASE_SHA:-$(git rev-parse HEAD^)}"
          python backend/scripts/check_orm_boundaries.py --diff-base "$base"

      - name: Failure classification summary
        if: failure()
        run: |
          {
            echo '### CI 失败分类'
            echo '- 环境失败：依赖安装或 Redis 服务步骤。'
            echo '- 代码/测试失败：pytest、compileall 或守卫步骤。'
            echo '- 测试分类错误：受影响 L1、清单或边界步骤。'
          } >> "$GITHUB_STEP_SUMMARY"

  # E2E 基线：只接入数据隔离、行为确定的关键路径（文件生命周期与 Runtime
  # 拖拽、日历、定时任务 UI/立即运行、GuguChat、Mind 画布），环境全部确定化——真实
  # Postgres/Redis + 本地存储后端 + 假 LLM
  # （scripts/mock_llm_server.py 固定回复，不接外部网络/不花钱/不受限流影响）。
  # 现有 Playwright 用例（filesystem-phases.spec.ts 等）大量依赖长期测试账号的
  # 既有数据、用 test.skip() 兜底，会出现"全绿但什么都没测"，仍不接入 CI；
  # OSS staging key 校验、Redis 锁续租超 TTL、崩溃恢复等后端安全/竞态场景继续
  # 留在 backend/tests/ 的 pytest 里验证，不强行塞进浏览器测试。
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pm
          POSTGRES_PASSWORD: pm123
          POSTGRES_DB: gugu_web
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pm -d gugu_web"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      VITE_USE_LOCAL_RUNTIME: '1'
      DB__HOST: 127.0.0.1
      DB__PORT: 5432
      DB__NAME: gugu_web
      DB__USER: pm
      DB__PASSWORD: pm123
      REDIS__HOST: 127.0.0.1
      REDIS__PORT: 6379
      STORAGE__BACKEND: local
      AI__PROVIDER: openai
      AI__BASE_URL: http://127.0.0.1:8899/v1
      AI__API_KEY: dummy
      AI__MODEL: e2e-mock
      SECRET_KEY: e2e-ci-not-a-real-secret
      PLAYWRIGHT_USERNAME: e2e_ci_user
      PLAYWRIGHT_PASSWORD: E2eCiPass!2026
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
      VITE_API_PROXY_TARGET: http://127.0.0.1:8000
    steps:
      - name: Checkout Gugu-web
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # E2E 通过 VITE_USE_LOCAL_RUNTIME=1 验证 pinned Runtime 的本地构建产物；
      # frontend/package.json 的默认依赖仍指向 npm 发布包。
      - name: Read pinned Runtime commit
        run: echo "RUNTIME_COMMIT=$(tr -d '[:space:]' < .runtime-version)" >> "$GITHUB_ENV"

      - name: Checkout pinned Runtime
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RUNTIME_REPOSITORY }}
          ref: ${{ env.RUNTIME_COMMIT }}
          path: gugu-interaction-runtime
          persist-credentials: false

      - name: Recreate local sibling layout
        run: ln -s "$GITHUB_WORKSPACE/gugu-interaction-runtime" "$GITHUB_WORKSPACE/../gugu-interaction-runtime"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Start mock LLM server
        working-directory: backend
        run: |
          PYTHONPATH=. nohup python -m uvicorn scripts.mock_llm_server:app --port 8899 \
            > /tmp/mock-llm.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8899/openapi.json > /dev/null && exit 0
            sleep 1
          done
          echo '::error::mock LLM server 未在预期时间内启动'; cat /tmp/mock-llm.log; exit 1

      - name: Start backend
        working-directory: backend
        run: |
          PYTHONPATH=. nohup python -m uvicorn app.main:app --port 8000 \
            > /tmp/backend.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/openapi.json > /dev/null && exit 0
            sleep 1
          done
          echo '::error::backend 未在预期时间内启动'; cat /tmp/backend.log; exit 1

      - name: Seed E2E test user
        working-directory: backend
        run: |
          PYTHONPATH=. python scripts/seed_e2e_user.py \
            http://127.0.0.1:8000 "$PLAYWRIGHT_USERNAME" "$PLAYWRIGHT_PASSWORD"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Runtime dependencies for integration alias
        working-directory: gugu-interaction-runtime
        run: npm ci --no-audit --no-fund

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          nohup npm run dev -- --port 5173 --strictPort > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:5173 > /dev/null && exit 0
            sleep 1
          done
          echo '::error::frontend dev server 未在预期时间内启动'; cat /tmp/frontend.log; exit 1

      - name: Check frontend API proxy login
        working-directory: frontend
        run: |
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "{\"username\":\"$PLAYWRIGHT_USERNAME\",\"password\":\"$PLAYWRIGHT_PASSWORD\"}" \
            -o /dev/null \
            http://127.0.0.1:5173/api/v1/auth/login

      - name: Run E2E (稳定关键路径)
        working-directory: frontend
        # 按文件而非 --grep 选测试：chromium 项目依赖 setup 项目（登录态），
        # --grep 会连 setup 项目里那条不带 @ci 的登录用例一起过滤掉，导致
        # 依赖链断裂；按路径跑则 setup 依赖照常执行，只是被测文件收窄。
        run: npm run test:e2e:stable

      - name: Upload backend/frontend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            /tmp/backend.log
            /tmp/frontend.log
            /tmp/mock-llm.log

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/

      - name: Failure classification summary
        if: failure()
        run: |
          {
            echo '### CI 失败分类'
            echo '- 环境失败：依赖安装、服务启动、fixture/seed 或浏览器安装步骤。'
            echo '- 代码/测试失败：标记为“代码/测试分类”的测试步骤。'
            echo '- 测试分类错误：清单、元数据或边界检查步骤失败。'
            echo '- 具体分类以失败步骤名称和对应日志为准。'
          } >> "$GITHUB_STEP_SUMMARY"

  loopscope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gugu-web
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install LoopScope dependencies
        working-directory: loopscope
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate && pnpm install --frozen-lockfile

      - name: Build LoopScope native dependencies
        working-directory: loopscope
        run: pnpm rebuild better-sqlite3

      - name: Build LoopScope packages
        working-directory: loopscope
        run: pnpm build

      - name: LoopScope collector tests
        working-directory: loopscope
        run: pnpm test

      - name: Install LoopScope frontend dependencies
        working-directory: loopscope/frontend
        run: npm install --no-audit --no-fund

      - name: LoopScope frontend typecheck
        working-directory: loopscope/frontend
        run: npm run typecheck

      - name: LoopScope frontend build
        working-directory: loopscope/frontend
        run: npm run build

      - name: Failure classification summary
        if: failure()
        run: |
          {
            echo '### CI 失败分类'
            echo '- 环境失败：依赖安装步骤。'
            echo '- 代码/测试失败：LoopScope 测试、类型检查或构建步骤。'
          } >> "$GITHUB_STEP_SUMMARY"
