server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location = /admin {
        return 301 /admin/;
    }

    # Vite hash 资源可以长期缓存；缺失时返回 404，不能回退为 SPA HTML。
    location ^~ /admin/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA 入口必须重新验证，避免发版后继续引用旧 hash 资源。
    location = /admin/index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 字体是静态二进制资源；缺失时必须返回 404，不能被 SPA 回退成 index.html。
    location ^~ /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
