[pytest]
testpaths = tests
asyncio_mode = auto
; SQLite 内存库 + 全部建表，不依赖外部 Postgres——越权测试要的是「可控的两个用户」，
; 不是真实数据；跑得快才会被经常跑。
; 并行：pytest-xdist（-n auto）。内存库/fake redis/直调路由逐 worker 独立，可安全分片；
; 不写进 addopts——单测调试（pdb）需要串行，全量回归与 CI 命令显式带 -n auto。
; 2026-09-17 实测（8 核 Mac）：串行 2m35s → -n auto 1m46s、-n 6 97s；超订（-n 10）反而变慢。

markers =
    slow: 执行时间较长的测试
    external_service: 依赖 Redis、Postgres、WebSocket、第三方服务或真实 I/O 的测试
    process: 启动进程、systemd、PTY 或终端运行时的测试
    e2e_support: 为浏览器端到端流程提供环境或支撑的测试
