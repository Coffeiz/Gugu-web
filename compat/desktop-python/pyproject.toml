[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gugu-desktop-host"
version = "0.1.0"
description = "咕咕桌面端 Core 管道宿主（实验性）"
requires-python = ">=3.12"
dependencies = ["gugu-core>=0.1.0,<0.2"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["gugu_desktop_host*"]
