# 本地/开发一键起全栈用的 Compose 文件；普通用户请使用根目录的默认 Compose。
# 生产环境请使用 docker-compose.prod.yml 或独立的生产部署方案。

name: gugu-web-compose
#
# 用法：
#   cp .env.example .env
#   cp backend/.env.example backend/.env   # 按需填写 SECRET_KEY / AI__* 等
#   docker compose -f docker-compose.dev.yml up -d                    # 默认轻量模式；不启动 Shell 沙盒
#   docker compose -f docker-compose.dev.yml --profile sandbox up -d  # 额外启用 sandboxd 和受控 egress
#   前端 → http://localhost:9595   后端 → http://localhost:8000/docs
#
# 直连 PyPI 官方源慢（部分网络环境常见，见 backend/Dockerfile 里 PIP_INDEX_URL 的注释）？
# 换源不用改文件，构建前设个环境变量即可（下面 backend/worker 的 build.args 会读到）：
#   PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple docker compose -f docker-compose.dev.yml build
#   PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple docker compose -f docker-compose.dev.yml up -d --build

x-json-file-logging: &json-file-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-gugu-data-mount: &gugu-data-mount
  type: bind
  source: ${GUGU_DATA_HOST_DIR:-./Gugu-data}
  target: /data
  bind:
    create_host_path: true

services:
  postgres:
    logging: *json-file-logging
    image: postgres:18
    environment:
      POSTGRES_USER: ${GUGU_DB_USER:-gugu}
      POSTGRES_PASSWORD: ${GUGU_DB_PASSWORD:-gugu_docker_pw}
      POSTGRES_DB: ${GUGU_DB_NAME:-gugu}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gugu -d gugu"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    logging: *json-file-logging
    image: redis:latest
    environment:
      GUGU_REDIS_PASSWORD: ${GUGU_REDIS_PASSWORD:-}
    command: ["sh", "-c", "if [ -n \"$${GUGU_REDIS_PASSWORD}\" ]; then exec redis-server --requirepass \"$${GUGU_REDIS_PASSWORD}\"; else exec redis-server; fi"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${GUGU_REDIS_PASSWORD}\" ]; then redis-cli -a \"$${GUGU_REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 普通联网搜索和图片搜索的本地引擎。后端通过 Compose 内网地址访问，
  # 宿主机只绑定 127.0.0.1，避免把未带认证的 JSON 搜索接口暴露到局域网。
  searxng:
    logging: *json-file-logging
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
      UWSGI_WORKERS: 1
      UWSGI_THREADS: 2
    mem_limit: 350m
    restart: unless-stopped

  # 受控 egress 代理。沙盒只连接 egress_internal，代理通过 default 网络访问公网；
  # 沙盒容器没有 default/bridge 网络，因此不能绕过代理直连外网。
  egress-proxy:
    profiles: [sandbox]
    logging: *json-file-logging
    image: ubuntu/squid:latest
    volumes:
      - ./squid/egress.conf:/etc/squid/squid.conf:ro
    networks:
      - default
      - egress_internal
    restart: unless-stopped

  # 开发观测 Collector。Gugu 的 backend/worker/gateway 默认通过 Compose 内网
  # 上报 LoopScope；数据保存在独立 volume，不混入业务 PostgreSQL。
  loopscope-collector:
    logging: *json-file-logging
    build:
      context: ./loopscope
      dockerfile: apps/collector/Dockerfile
    environment:
      LOOPSCOPE_HOST: 0.0.0.0
      LOOPSCOPE_PORT: 4320
      LOOPSCOPE_DB_PATH: /data/loopscope.db
    ports:
      - "127.0.0.1:4320:4320"
    volumes:
      - loopscope_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4320/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 只执行一次的数据库初始化/迁移任务。Web 和 Worker 都等它成功后再启动，
  # 避免两个容器同时执行 alembic 产生迁移竞态。
  migrate:
    logging: *json-file-logging
    build:
      context: ./backend
      args:
        - PIP_INDEX_URL
        - GUGU_INSTALL_DOCKER_CLI=false
    command: ["python", "-c", "from pathlib import Path; Path('/data/users').mkdir(parents=True, exist_ok=True)"]
    env_file:
      - ./backend/.env
    environment:
      PUBLIC_APP_URL: ${GUGU_PUBLIC_APP_URL:-http://localhost:9595}
      DB__HOST: ${GUGU_DB_HOST:-postgres}
      DB__PORT: ${GUGU_DB_PORT:-5432}
      DB__NAME: ${GUGU_DB_NAME:-gugu}
      DB__USER: ${GUGU_DB_USER:-gugu}
      DB__PASSWORD: ${GUGU_DB_PASSWORD:-gugu_docker_pw}
      STORAGE__LOCAL_PATH: /data/users
      # BYOK 主密钥文件必须落在持久卷：默认路径在容器可写层，每次更新重建容器都会
      # 丢密钥，导致已保存的凭据解密失败、被迫重新输入各提供商 API Key
      CREDENTIALS_MASTER_KEY_FILE: /data/byok/.byok-master-key
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - *gugu-data-mount

  # v1.0.6 起用户数据使用宿主机 Gugu-data。旧版本若使用 named volume，
  # 先由这个一次性服务复制到新目录；成功后写入 /data/.system/migrations marker，后续
  # 启动直接跳过旧卷扫描。源卷只读且永不自动删除。
  data-migrate:
    logging: *json-file-logging
    build:
      context: ./backend
      args:
        - PIP_INDEX_URL
        - GUGU_INSTALL_DOCKER_CLI=false
    entrypoint: []
    command: ["python", "scripts/migrate_storage_root.py", "--source", "/legacy", "--target", "/data", "--apply", "--no-config-update"]
    volumes:
      - ./backend:/app:ro
      - legacy_gugu_data:/legacy:ro
      - *gugu-data-mount
    restart: "no"

  backend:
    # sandboxd 用 SO_PEERCRED 校验连接方进程；跨容器 PID namespace 拿不到真实 pid，
    # backend 与 sandboxd 需共享 host pid namespace（同 docker-compose.prod.yml）。
    pid: "host"
    logging: *json-file-logging
    build:
      context: ./backend
      # 裸变量名（不是 `PIP_INDEX_URL: ${PIP_INDEX_URL:-}` 那种带默认值写法）——环境变量没设置
      # 时 compose 不会传这个 build arg，落到 Dockerfile 里 ARG 的默认值（官方 PyPI 源）；带
      # `:-` 写法未设置时会解析成空字符串，作为显式空值传给 docker build 反而**覆盖**掉那个默认值，
      # 变成一个空 index url——2026-07-14 实测过这个坑，两种写法差着能不能装上依赖。
      args:
        - PIP_INDEX_URL
        - GUGU_INSTALL_DOCKER_CLI=false
    ports:
      - "8000:8000"
    env_file:
      # backend/.env 是应用自己按 app/core/config.py 的 env_file=".env" 约定去找的路径
      # （从 backend/ 目录启动时相对路径解析），跟下面 environment: 覆盖的 DB__*/REDIS__*
      # 不冲突——environment 优先级更高，专门覆盖成 compose 网络里的服务名。
      - ./backend/.env
    environment:
      PUBLIC_APP_URL: ${GUGU_PUBLIC_APP_URL:-http://localhost:9595}
      DB__HOST: ${GUGU_DB_HOST:-postgres}
      DB__PORT: ${GUGU_DB_PORT:-5432}
      DB__NAME: ${GUGU_DB_NAME:-gugu}
      DB__USER: ${GUGU_DB_USER:-gugu}
      DB__PASSWORD: ${GUGU_DB_PASSWORD:-gugu_docker_pw}
      REDIS__HOST: ${GUGU_REDIS_HOST:-redis}
      REDIS__PORT: ${GUGU_REDIS_PORT:-6379}
      REDIS__PASSWORD: ${GUGU_REDIS_PASSWORD:-}
      SEARCH__SEARXNG_URL: http://searxng:8080
      STORAGE__LOCAL_PATH: /data/users
      # BYOK 主密钥文件必须落在持久卷：默认路径在容器可写层，每次更新重建容器都会
      # 丢密钥，导致已保存的凭据解密失败、被迫重新输入各提供商 API Key
      CREDENTIALS_MASTER_KEY_FILE: /data/byok/.byok-master-key
      GUGU_SANDBOXD_SOCKET: /run/gugu/sandboxd.sock
      SANDBOX__ENABLED: ${GUGU_SANDBOX_ENABLED:-true}
      SANDBOX__NETWORK_PROFILE: ${GUGU_SANDBOX_NETWORK_PROFILE:-egress}
      SANDBOX__IMAGE: ${GUGU_SANDBOX_IMAGE:-debian:bookworm-slim}
      SANDBOX__IMAGE_DIGEST: ${GUGU_SANDBOX_IMAGE_DIGEST:-sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171}
      SANDBOX__EGRESS_PROXY_URL: http://egress-proxy:3128
      SANDBOX__EGRESS_NETWORK_NAME: gugu-sandbox-egress
      # 宿主 daemon 视角的数据根：沙盒 bind src 按它把容器内 /data/users 翻译成宿主路径
      SANDBOX__HOST_DATA_ROOT: ${GUGU_DATA_HOST_DIR:-${PWD}/Gugu-data}/users
      SANDBOX__EGRESS_ISOLATION_ENABLED: "true"
      LOOPSCOPE_ENABLED: "1"
      LOOPSCOPE_ENDPOINT: http://loopscope-collector:4320
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      data-migrate:
        condition: service_completed_successfully
      loopscope-collector:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - *gugu-data-mount
      - sandbox_socket:/run/gugu

  # IM 队列消费者（飞书/QQ/微信消息 → 跑 agent 回复）——跟 backend 是同一个镜像，
  # 只是 command 换成 worker 入口；没配 IM 频道凭据也能起，只是收不到消息，不影响
  # web API 本身。
  worker:
    logging: *json-file-logging
    build:
      context: ./backend
      args:
        - PIP_INDEX_URL   # 跟 backend 同一个镜像/同一个坑，见上面 backend.build.args 的注释
        - GUGU_INSTALL_DOCKER_CLI=false
    command: ["python", "-m", "worker"]
    env_file:
      - ./backend/.env
    environment:
      DB__HOST: ${GUGU_DB_HOST:-postgres}
      DB__PORT: ${GUGU_DB_PORT:-5432}
      DB__NAME: ${GUGU_DB_NAME:-gugu}
      DB__USER: ${GUGU_DB_USER:-gugu}
      DB__PASSWORD: ${GUGU_DB_PASSWORD:-gugu_docker_pw}
      REDIS__HOST: ${GUGU_REDIS_HOST:-redis}
      REDIS__PORT: ${GUGU_REDIS_PORT:-6379}
      REDIS__PASSWORD: ${GUGU_REDIS_PASSWORD:-}
      SEARCH__SEARXNG_URL: http://searxng:8080
      STORAGE__LOCAL_PATH: /data/users
      # BYOK 主密钥文件必须落在持久卷：默认路径在容器可写层，每次更新重建容器都会
      # 丢密钥，导致已保存的凭据解密失败、被迫重新输入各提供商 API Key
      CREDENTIALS_MASTER_KEY_FILE: /data/byok/.byok-master-key
      GUGU_SANDBOXD_SOCKET: /run/gugu/sandboxd.sock
      SANDBOX__ENABLED: ${GUGU_SANDBOX_ENABLED:-true}
      SANDBOX__NETWORK_PROFILE: ${GUGU_SANDBOX_NETWORK_PROFILE:-egress}
      SANDBOX__IMAGE: ${GUGU_SANDBOX_IMAGE:-debian:bookworm-slim}
      SANDBOX__IMAGE_DIGEST: ${GUGU_SANDBOX_IMAGE_DIGEST:-sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171}
      SANDBOX__EGRESS_PROXY_URL: http://egress-proxy:3128
      SANDBOX__EGRESS_NETWORK_NAME: gugu-sandbox-egress
      # 宿主 daemon 视角的数据根：沙盒 bind src 按它把容器内 /data/users 翻译成宿主路径
      SANDBOX__HOST_DATA_ROOT: ${GUGU_DATA_HOST_DIR:-${PWD}/Gugu-data}/users
      SANDBOX__EGRESS_ISOLATION_ENABLED: "true"
      LOOPSCOPE_ENABLED: "1"
      LOOPSCOPE_ENDPOINT: http://loopscope-collector:4320
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      data-migrate:
        condition: service_completed_successfully
      loopscope-collector:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - *gugu-data-mount
      - sandbox_socket:/run/gugu

  # IM 网关管家（飞书/QQ/微信）。worker 负责消费消息队列，gateway 负责平台长连接。
  gateway:
    logging: *json-file-logging
    build:
      context: ./backend
      args:
        - PIP_INDEX_URL
        - GUGU_INSTALL_DOCKER_CLI=false
    command: ["python", "-m", "agent.gateway.gateway"]
    env_file:
      - ./backend/.env
    environment:
      DB__HOST: ${GUGU_DB_HOST:-postgres}
      DB__PORT: ${GUGU_DB_PORT:-5432}
      DB__NAME: ${GUGU_DB_NAME:-gugu}
      DB__USER: ${GUGU_DB_USER:-gugu}
      DB__PASSWORD: ${GUGU_DB_PASSWORD:-gugu_docker_pw}
      REDIS__HOST: ${GUGU_REDIS_HOST:-redis}
      REDIS__PORT: ${GUGU_REDIS_PORT:-6379}
      REDIS__PASSWORD: ${GUGU_REDIS_PASSWORD:-}
      STORAGE__LOCAL_PATH: /data/users
      # BYOK 主密钥文件必须落在持久卷：默认路径在容器可写层，每次更新重建容器都会
      # 丢密钥，导致已保存的凭据解密失败、被迫重新输入各提供商 API Key
      CREDENTIALS_MASTER_KEY_FILE: /data/byok/.byok-master-key
      LOOPSCOPE_ENABLED: "1"
      LOOPSCOPE_ENDPOINT: http://loopscope-collector:4320
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      data-migrate:
        condition: service_completed_successfully
      loopscope-collector:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - *gugu-data-mount

  # 工具执行随 backend/worker 镜像提供，生产 Shell 沙盒由这个可选进程承接。
  # 只有显式启用 --profile sandbox 才构建/启动；轻量模式不会安装 Docker CLI。
  sandboxd:
    profiles: [sandbox]
    # 与 backend 共享 host pid namespace，SO_PEERCRED peer 校验才能拿到真实 pid/uid。
    pid: "host"
    logging: *json-file-logging
    build:
      context: ./backend
      args:
        - PIP_INDEX_URL
        - GUGU_INSTALL_DOCKER_CLI=true
    command: ["python", "-m", "agent.sandbox.sandboxd", "--socket", "/run/gugu/sandboxd.sock", "--allowed-root", "/data/users"]
    env_file:
      - ./backend/.env
    environment:
      DOCKER_HOST: unix:///run/gugu/docker.sock
      STORAGE__LOCAL_PATH: /data/users
      # BYOK 主密钥文件必须落在持久卷：默认路径在容器可写层，每次更新重建容器都会
      # 丢密钥，导致已保存的凭据解密失败、被迫重新输入各提供商 API Key
      CREDENTIALS_MASTER_KEY_FILE: /data/byok/.byok-master-key
      GUGU_SANDBOXD_SOCKET: /run/gugu/sandboxd.sock
      SANDBOX__ENABLED: ${GUGU_SANDBOX_ENABLED:-true}
      SANDBOX__NETWORK_PROFILE: ${GUGU_SANDBOX_NETWORK_PROFILE:-egress}
      SANDBOX__IMAGE: ${GUGU_SANDBOX_IMAGE:-debian:bookworm-slim}
      SANDBOX__IMAGE_DIGEST: ${GUGU_SANDBOX_IMAGE_DIGEST:-sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171}
      SANDBOX__ROOTLESS_REQUIRED: ${GUGU_SANDBOX_ROOTLESS_REQUIRED:-true}
      SANDBOX__EGRESS_PROXY_URL: http://egress-proxy:3128
      SANDBOX__EGRESS_NETWORK_NAME: gugu-sandbox-egress
      # 宿主 daemon 视角的数据根：沙盒 bind src 按它把容器内 /data/users 翻译成宿主路径
      SANDBOX__HOST_DATA_ROOT: ${GUGU_DATA_HOST_DIR:-${PWD}/Gugu-data}/users
      SANDBOX__EGRESS_ISOLATION_ENABLED: "true"
    volumes:
      - *gugu-data-mount
      - sandbox_socket:/run/gugu
      - ${GUGU_DOCKER_SOCKET:-/var/run/docker.sock}:/run/gugu/docker.sock
    depends_on:
      sandbox-bootstrap:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      data-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # 一次性引导：沙盒兄弟容器实际运行在 GUGU_DOCKER_SOCKET 指向的 daemon，compose 建
  # 的网络/容器在该 daemon 是别的 daemon 时不可见（典型：rootless docker）。此服务确保
  # 目标 daemon 上有沙盒所需镜像、egress 内部网络与 squid 代理；默认 rootful 单 daemon
  # 部署下各项已由 compose 提供，脚本自动全部跳过；已有 bootstrap marker 时也会跳过。
  sandbox-bootstrap:
    profiles: [sandbox]
    logging: *json-file-logging
    build:
      context: ./backend
      args:
        - PIP_INDEX_URL
        - GUGU_INSTALL_DOCKER_CLI=true
    # 清空镜像 entrypoint：backend 的 docker-entrypoint.sh 会等库+跑迁移，与 migrate
    # 服务并发有竞态；bootstrap 只准备沙盒 daemon 资源、不碰数据库，直接执行脚本。
    entrypoint: []
    command: ["sh", "/usr/local/bin/gugu-sandbox-init.sh"]
    env_file:
      - ./backend/.env
    environment:
      DOCKER_HOST: unix:///run/gugu/docker.sock
      SANDBOX__IMAGE: ${GUGU_SANDBOX_IMAGE:-debian:bookworm-slim}
      SANDBOX__IMAGE_DIGEST: ${GUGU_SANDBOX_IMAGE_DIGEST:-sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171}
      SANDBOX__EGRESS_PROXY_URL: http://egress-proxy:3128
      SANDBOX__EGRESS_NETWORK_NAME: gugu-sandbox-egress
      # 宿主 daemon 视角的数据根：沙盒 bind src 按它把容器内 /data/users 翻译成宿主路径
      SANDBOX__HOST_DATA_ROOT: ${GUGU_DATA_HOST_DIR:-${PWD}/Gugu-data}/users
    # 故意不默认挂宿主 rootful socket：rootless-only 主机没有 /var/run/docker.sock，
    # 挂了会让 compose 直接起不来；镜像缺失时脚本退化为 rootless 直接 pull。
    # rootless 无法拉镜像的机器可自行在 override 里把 rootful socket 只读挂进
    # /var/run/docker.sock，脚本会自动改走 save|load 搬运。
    volumes:
      - ${GUGU_DOCKER_SOCKET:-/var/run/docker.sock}:/run/gugu/docker.sock
      - ./squid/egress.conf:/config/squid/egress.conf:ro
      - ./backend/scripts/sandbox_rootless_init.sh:/usr/local/bin/gugu-sandbox-init.sh:ro
      - *gugu-data-mount
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/subuid:/host/etc/subuid:ro
      - /etc/subgid:/host/etc/subgid:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      data-migrate:
        condition: service_completed_successfully
    restart: "no"

  frontend:
    logging: *json-file-logging
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "9595:5173"   # 宿主机 9595 → 容器内 vite dev server 仍然是 5173，容器内部端口不用改
    environment:
      # 见 vite.config.js 的 proxy 注释：容器网络里 "localhost" 指前端容器自己，
      # 用 compose 服务名 backend 才能连到后端容器。
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/workspace/frontend
      # 源码目录挂载会覆盖镜像内的 frontend/node_modules；依赖卷必须挂在被覆盖的
      # 子目录上，否则 pnpm dev 启动时找不到 Vite。
      - /workspace/frontend/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  # 用户数据不能用普通 named volume：Shell 沙盒容器由 backend 通过 docker.sock
  # 作为兄弟容器启动，其 --mount src=/data/users/<uid>/shell 由宿主机 daemon 解析，
  # 因此宿主机上必须存在与容器内一致的 Gugu-data 路径。这里直接 bind
  # GUGU_DATA_HOST_DIR（默认 Gugu-data）；旧 named volume 由
  # data-migrate 自动迁移，源卷保留不删除。
  legacy_gugu_data:
    name: ${GUGU_LEGACY_DATA_VOLUME:-gugu-web-compose_gugu_data}
  sandbox_socket:
  loopscope_data:

networks:
