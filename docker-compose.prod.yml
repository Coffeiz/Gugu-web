# 生产分体 Compose：只消费已构建镜像；sandbox manager 和 egress 由外部 Rootless 部署管理。
# 默认入口：http://localhost:9595；使用前需让 backend/worker 可访问 external sandbox socket。
# 使用前设置 GUGU_BACKEND_IMAGE、GUGU_FRONTEND_IMAGE、GUGU_DB_PASSWORD。

name: gugu-web-compose

x-json-file-logging: &json-file-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

configs:
  searxng-settings:
    content: |
      # Compose 内置 SearXNG 配置；JSON 是 Gugu web_search/image_search 的必需格式。
      use_default_settings: true

      server:
        secret_key: "gugu-compose-dev-change-me"
        limiter: false

      search:
        formats:
          - html
          - json

x-gugu-data-mount: &gugu-data-mount
  type: bind
  source: ${GUGU_DATA_HOST_DIR:-./Gugu-data}
  target: /data
  bind:
    create_host_path: true

services:
  postgres:
    logging: *json-file-logging
    image: postgres:18
    environment:
      POSTGRES_USER: ${GUGU_DB_USER:-gugu}
      POSTGRES_PASSWORD: ${GUGU_DB_PASSWORD:?请设置 GUGU_DB_PASSWORD}
      POSTGRES_DB: ${GUGU_DB_NAME:-gugu}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    logging: *json-file-logging
    image: redis:latest
    environment:
      GUGU_REDIS_PASSWORD: ${GUGU_REDIS_PASSWORD:-}
    # IM 入站消息先进入 Redis Stream；AOF 每秒刷盘，容器重建后可从持久卷恢复未完成队列。
    command: ["sh", "-c", "if [ -n \"$${GUGU_REDIS_PASSWORD}\" ]; then exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$${GUGU_REDIS_PASSWORD}\"; else exec redis-server --appendonly yes --appendfsync everysec; fi"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${GUGU_REDIS_PASSWORD}\" ]; then redis-cli -a \"$${GUGU_REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 20

  searxng:
    logging: *json-file-logging
    image: searxng/searxng:latest
    configs:
      - source: searxng-settings
        target: /etc/searxng/settings.yml
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080/}
      UWSGI_WORKERS: 2
      UWSGI_THREADS: 4
    mem_limit: 512m
    restart: unless-stopped

  migrate:
    logging: *json-file-logging
    image: ${GUGU_BACKEND_IMAGE:?请设置 GUGU_BACKEND_IMAGE}
    command: ["python", "-c", "from pathlib import Path; Path('/data/users').mkdir(parents=True, exist_ok=True)"]
    # 一次性任务不提供 Web 服务，不能继承后端镜像的 HTTP 健康检查。
    healthcheck:
      disable: true
    env_file:
      - ./backend/.env
    environment:
      PUBLIC_APP_URL: ${GUGU_PUBLIC_APP_URL:-http://localhost:9595}
      DB__HOST: ${GUGU_DB_HOST:-postgres}
      DB__PORT: ${GUGU_DB_PORT:-5432}
      DB__NAME: ${GUGU_DB_NAME:-gugu}
      DB__USER: ${GUGU_DB_USER:-gugu}
      DB__PASSWORD: ${GUGU_DB_PASSWORD:?请设置 GUGU_DB_PASSWORD}
      STORAGE__LOCAL_PATH: /data/users
      # BYOK 主密钥文件必须落在持久卷：默认路径在容器可写层，每次更新重建容器都会
      # 丢密钥，导致已保存的凭据解密失败、被迫重新输入各提供商 API Key
      CREDENTIALS_MASTER_KEY_FILE: /data/byok/.byok-master-key
      GUGU_CONFIG_OVERRIDE_FILE: /config/config.override.json
      SANDBOX__ENABLED: ${GUGU_SANDBOX_ENABLED:-true}
      SANDBOX__NETWORK_PROFILE: ${GUGU_SANDBOX_NETWORK_PROFILE:-egress}
      SANDBOX__IMAGE: ${GUGU_SANDBOX_IMAGE:-debian:bookworm-slim}
      SANDBOX__IMAGE_DIGEST: ${GUGU_SANDBOX_IMAGE_DIGEST:-sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171}
      SANDBOX__EGRESS_PROXY_URL: ${GUGU_SANDBOX_EGRESS_PROXY_URL:-http://egress-proxy:3128}
      SANDBOX__EGRESS_NETWORK_NAME: ${GUGU_SANDBOX_EGRESS_NETWORK_NAME:-gugu-sandbox-egress}
      SANDBOX__EGRESS_ISOLATION_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - *gugu-data-mount
      - gugu_config:/config

  backend:
    # sandboxd 用 SO_PEERCRED 校验连接方进程；backend 与 sandboxd 分属不同容器时
    # 跨 PID namespace 无法翻译 peer pid（返回 0 被判"请求进程无效"），共享 host pid namespace。
    pid: "host"
    logging: *json-file-logging
    image: ${GUGU_BACKEND_IMAGE:?请设置 GUGU_BACKEND_IMAGE}
    env_file:
      - ./backend/.env
    environment:
      GUGU_UPDATE_DEPLOYMENT_MODE: split_compose
      PUBLIC_APP_URL: ${GUGU_PUBLIC_APP_URL:-http://localhost:9595}
      GUGU_LOG_FILE: /app/logs/gugu.log
      DB__HOST: ${GUGU_DB_HOST:-postgres}
      DB__PORT: ${GUGU_DB_PORT:-5432}
      DB__NAME: ${GUGU_DB_NAME:-gugu}
      DB__USER: ${GUGU_DB_USER:-gugu}
      DB__PASSWORD: ${GUGU_DB_PASSWORD:?请设置 GUGU_DB_PASSWORD}
      REDIS__HOST: ${GUGU_REDIS_HOST:-redis}
      REDIS__PORT: ${GUGU_REDIS_PORT:-6379}
      REDIS__PASSWORD: ${GUGU_REDIS_PASSWORD:-}
      SEARCH__SEARXNG_URL: http://searxng:8080
      STORAGE__LOCAL_PATH: /data/users
      # BYOK 主密钥文件必须落在持久卷：默认路径在容器可写层，每次更新重建容器都会
      # 丢密钥，导致已保存的凭据解密失败、被迫重新输入各提供商 API Key
      CREDENTIALS_MASTER_KEY_FILE: /data/byok/.byok-master-key
      GUGU_SANDBOXD_SOCKET: /run/gugu/sandboxd.sock
      GUGU_SANDBOX_MANAGER_MODE: external
      SANDBOX__ROOTLESS_REQUIRED: "true"
      GUGU_CONFIG_OVERRIDE_FILE: /config/config.override.json
      SANDBOX__ENABLED: ${GUGU_SANDBOX_ENABLED:-true}
      SANDBOX__NETWORK_PROFILE: ${GUGU_SANDBOX_NETWORK_PROFILE:-egress}
      SANDBOX__IMAGE: ${GUGU_SANDBOX_IMAGE:-debian:bookworm-slim}
      SANDBOX__IMAGE_DIGEST: ${GUGU_SANDBOX_IMAGE_DIGEST:-sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171}
      SANDBOX__EGRESS_PROXY_URL: ${GUGU_SANDBOX_EGRESS_PROXY_URL:-http://egress-proxy:3128}
      SANDBOX__EGRESS_NETWORK_NAME: ${GUGU_SANDBOX_EGRESS_NETWORK_NAME:-gugu-sandbox-egress}
      SANDBOX__EGRESS_ISOLATION_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - *gugu-data-mount
      - gugu_config:/config
      - sandbox_socket:/run/gugu
      - gugu_logs:/app/logs
    restart: unless-stopped

  worker:
    logging: *json-file-logging
    image: ${GUGU_BACKEND_IMAGE:?请设置 GUGU_BACKEND_IMAGE}
    command: ["python", "-m", "worker"]
    # Worker 没有 HTTP 健康端点，避免继承 backend 镜像的 /health 探针。
    healthcheck:
      disable: true
    env_file:
      - ./backend/.env
    environment:
      GUGU_LOG_FILE: /app/logs/gugu-worker.log
      DB__HOST: ${GUGU_DB_HOST:-postgres}
      DB__PORT: ${GUGU_DB_PORT:-5432}
      DB__NAME: ${GUGU_DB_NAME:-gugu}
      DB__USER: ${GUGU_DB_USER:-gugu}
      DB__PASSWORD: ${GUGU_DB_PASSWORD:?请设置 GUGU_DB_PASSWORD}
      REDIS__HOST: ${GUGU_REDIS_HOST:-redis}
      REDIS__PORT: ${GUGU_REDIS_PORT:-6379}
      REDIS__PASSWORD: ${GUGU_REDIS_PASSWORD:-}
      SEARCH__SEARXNG_URL: http://searxng:8080
      STORAGE__LOCAL_PATH: /data/users
      # BYOK 主密钥文件必须落在持久卷：默认路径在容器可写层，每次更新重建容器都会
      # 丢密钥，导致已保存的凭据解密失败、被迫重新输入各提供商 API Key
      CREDENTIALS_MASTER_KEY_FILE: /data/byok/.byok-master-key
      GUGU_SANDBOXD_SOCKET: /run/gugu/sandboxd.sock
      GUGU_SANDBOX_MANAGER_MODE: external
      SANDBOX__ROOTLESS_REQUIRED: "true"
      GUGU_CONFIG_OVERRIDE_FILE: /config/config.override.json
      SANDBOX__ENABLED: ${GUGU_SANDBOX_ENABLED:-true}
      SANDBOX__NETWORK_PROFILE: ${GUGU_SANDBOX_NETWORK_PROFILE:-egress}
      SANDBOX__IMAGE: ${GUGU_SANDBOX_IMAGE:-debian:bookworm-slim}
      SANDBOX__IMAGE_DIGEST: ${GUGU_SANDBOX_IMAGE_DIGEST:-sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171}
      SANDBOX__EGRESS_PROXY_URL: http://egress-proxy:3128
      SANDBOX__EGRESS_NETWORK_NAME: gugu-sandbox-egress
      SANDBOX__EGRESS_ISOLATION_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - *gugu-data-mount
      - gugu_config:/config
      - sandbox_socket:/run/gugu
      - gugu_logs:/app/logs
    restart: unless-stopped

  # IM 网关管家（飞书/QQ/微信）。worker 负责消费消息队列，gateway 负责平台长连接。
  gateway:
    logging: *json-file-logging
    image: ${GUGU_BACKEND_IMAGE:?请设置 GUGU_BACKEND_IMAGE}
    command: ["python", "-m", "agent.gateway.gateway"]
    # Gateway 没有 HTTP 健康端点，避免继承 backend 镜像的 /health 探针。
    healthcheck:
      disable: true
    env_file:
      - ./backend/.env
    environment:
      GUGU_LOG_FILE: /app/logs/gugu-gateway.log
      DB__HOST: ${GUGU_DB_HOST:-postgres}
      DB__PORT: ${GUGU_DB_PORT:-5432}
      DB__NAME: ${GUGU_DB_NAME:-gugu}
      DB__USER: ${GUGU_DB_USER:-gugu}
      DB__PASSWORD: ${GUGU_DB_PASSWORD:?请设置 GUGU_DB_PASSWORD}
      REDIS__HOST: ${GUGU_REDIS_HOST:-redis}
      REDIS__PORT: ${GUGU_REDIS_PORT:-6379}
      REDIS__PASSWORD: ${GUGU_REDIS_PASSWORD:-}
      STORAGE__LOCAL_PATH: /data/users
      # BYOK 主密钥文件必须落在持久卷：默认路径在容器可写层，每次更新重建容器都会
      # 丢密钥，导致已保存的凭据解密失败、被迫重新输入各提供商 API Key
      CREDENTIALS_MASTER_KEY_FILE: /data/byok/.byok-master-key
      GUGU_CONFIG_OVERRIDE_FILE: /config/config.override.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - *gugu-data-mount
      - gugu_config:/config
      - gugu_logs:/app/logs
    restart: unless-stopped

  frontend:
    logging: *json-file-logging
    image: ${GUGU_FRONTEND_IMAGE:?请设置 GUGU_FRONTEND_IMAGE}
    depends_on:
      - backend

  nginx:
    logging: *json-file-logging
    image: nginx:alpine
    ports:
      - "${GUGU_HTTP_PORT:-9595}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  gugu_config:
  # Socket volume is provisioned and lifecycle-managed by the external Rootless manager.
  sandbox_socket:
    external: true
    name: ${GUGU_SANDBOX_SOCKET_VOLUME:-gugu-web-compose_sandbox_socket}
  gugu_logs:
