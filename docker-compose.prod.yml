# 生产 Compose：只消费已经构建好的镜像，不挂载源码，不运行 Vite/Uvicorn reload。
# 默认入口：http://localhost:9595；默认不启动 Shell 沙盒；使用 --profile sandbox 启用
# 使用前设置 GUGU_BACKEND_IMAGE、GUGU_FRONTEND_IMAGE、GUGU_DB_PASSWORD。

name: gugu-web-compose

x-json-file-logging: &json-file-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    logging: *json-file-logging
    image: postgres:18
    environment:
      POSTGRES_USER: ${GUGU_DB_USER:-gugu}
      POSTGRES_PASSWORD: ${GUGU_DB_PASSWORD:?请设置 GUGU_DB_PASSWORD}
      POSTGRES_DB: ${GUGU_DB_NAME:-gugu}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    logging: *json-file-logging
    image: redis:latest
    environment:
      GUGU_REDIS_PASSWORD: ${GUGU_REDIS_PASSWORD:-}
    command: ["sh", "-c", "if [ -n \"$${GUGU_REDIS_PASSWORD}\" ]; then exec redis-server --requirepass \"$${GUGU_REDIS_PASSWORD}\"; else exec redis-server; fi"]
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${GUGU_REDIS_PASSWORD}\" ]; then redis-cli -a \"$${GUGU_REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 20

  searxng:
    logging: *json-file-logging
    image: searxng/searxng:latest
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080/}
      UWSGI_WORKERS: 2
      UWSGI_THREADS: 4
    mem_limit: 512m
    restart: unless-stopped

  egress-proxy:
    profiles: [sandbox]
    logging: *json-file-logging
    image: ubuntu/squid:latest
    volumes:
      - ./squid/egress.conf:/etc/squid/squid.conf:ro
    networks:
      - default
      - egress_internal
    restart: unless-stopped

  migrate:
    logging: *json-file-logging
    image: ${GUGU_BACKEND_IMAGE:?请设置 GUGU_BACKEND_IMAGE}
    command: ["python", "-c", "from pathlib import Path; Path('/data/users').mkdir(parents=True, exist_ok=True)"]
    env_file:
      - ./backend/.env
    environment:
      PUBLIC_APP_URL: ${GUGU_PUBLIC_APP_URL:-http://localhost:9595}
      DB__HOST: ${GUGU_DB_HOST:-postgres}
      DB__PORT: ${GUGU_DB_PORT:-5432}
      DB__NAME: ${GUGU_DB_NAME:-gugu}
      DB__USER: ${GUGU_DB_USER:-gugu}
      DB__PASSWORD: ${GUGU_DB_PASSWORD:?请设置 GUGU_DB_PASSWORD}
      STORAGE__LOCAL_PATH: /data/users
      GUGU_CONFIG_OVERRIDE_FILE: /config/config.override.json
      SANDBOX__ENABLED: ${GUGU_SANDBOX_ENABLED:-true}
      SANDBOX__NETWORK_PROFILE: ${GUGU_SANDBOX_NETWORK_PROFILE:-egress}
      SANDBOX__EGRESS_PROXY_URL: http://egress-proxy:3128
      SANDBOX__EGRESS_NETWORK_NAME: gugu-sandbox-egress
      SANDBOX__EGRESS_ISOLATION_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - gugu_data:/data
      - gugu_config:/config

  backend:
    # sandboxd 用 SO_PEERCRED 校验连接方进程；backend 与 sandboxd 分属不同容器时
    # 跨 PID namespace 无法翻译 peer pid（返回 0 被判"请求进程无效"），共享 host pid namespace。
    pid: "host"
    logging: *json-file-logging
    image: ${GUGU_BACKEND_IMAGE:?请设置 GUGU_BACKEND_IMAGE}
    env_file:
      - ./backend/.env
    environment:
      PUBLIC_APP_URL: ${GUGU_PUBLIC_APP_URL:-http://localhost:9595}
      DOCKER_HOST: unix:///run/gugu/docker.sock
      GUGU_LOG_FILE: /app/logs/gugu.log
      DB__HOST: ${GUGU_DB_HOST:-postgres}
      DB__PORT: ${GUGU_DB_PORT:-5432}
      DB__NAME: ${GUGU_DB_NAME:-gugu}
      DB__USER: ${GUGU_DB_USER:-gugu}
      DB__PASSWORD: ${GUGU_DB_PASSWORD:?请设置 GUGU_DB_PASSWORD}
      REDIS__HOST: ${GUGU_REDIS_HOST:-redis}
      REDIS__PORT: ${GUGU_REDIS_PORT:-6379}
      REDIS__PASSWORD: ${GUGU_REDIS_PASSWORD:-}
      SEARCH__SEARXNG_URL: http://searxng:8080
      STORAGE__LOCAL_PATH: /data/users
      GUGU_SANDBOXD_SOCKET: /run/gugu/sandboxd.sock
      GUGU_CONFIG_OVERRIDE_FILE: /config/config.override.json
      SANDBOX__ENABLED: ${GUGU_SANDBOX_ENABLED:-true}
      SANDBOX__NETWORK_PROFILE: ${GUGU_SANDBOX_NETWORK_PROFILE:-egress}
      SANDBOX__EGRESS_PROXY_URL: http://egress-proxy:3128
      SANDBOX__EGRESS_NETWORK_NAME: gugu-sandbox-egress
      SANDBOX__EGRESS_ISOLATION_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - gugu_data:/data
      - gugu_config:/config
      - sandbox_socket:/run/gugu
      - ${GUGU_DOCKER_SOCKET:-/var/run/docker.sock}:/run/gugu/docker.sock
      - gugu_logs:/app/logs
    restart: unless-stopped

  worker:
    logging: *json-file-logging
    image: ${GUGU_BACKEND_IMAGE:?请设置 GUGU_BACKEND_IMAGE}
    command: ["python", "-m", "worker"]
    env_file:
      - ./backend/.env
    environment:
      GUGU_LOG_FILE: /app/logs/gugu-worker.log
      DB__HOST: ${GUGU_DB_HOST:-postgres}
      DB__PORT: ${GUGU_DB_PORT:-5432}
      DB__NAME: ${GUGU_DB_NAME:-gugu}
      DB__USER: ${GUGU_DB_USER:-gugu}
      DB__PASSWORD: ${GUGU_DB_PASSWORD:?请设置 GUGU_DB_PASSWORD}
      REDIS__HOST: ${GUGU_REDIS_HOST:-redis}
      REDIS__PORT: ${GUGU_REDIS_PORT:-6379}
      REDIS__PASSWORD: ${GUGU_REDIS_PASSWORD:-}
      SEARCH__SEARXNG_URL: http://searxng:8080
      STORAGE__LOCAL_PATH: /data/users
      GUGU_SANDBOXD_SOCKET: /run/gugu/sandboxd.sock
      GUGU_CONFIG_OVERRIDE_FILE: /config/config.override.json
      SANDBOX__ENABLED: ${GUGU_SANDBOX_ENABLED:-true}
      SANDBOX__NETWORK_PROFILE: ${GUGU_SANDBOX_NETWORK_PROFILE:-egress}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - gugu_data:/data
      - gugu_config:/config
      - sandbox_socket:/run/gugu
      - gugu_logs:/app/logs
    restart: unless-stopped

  # IM 网关管家（飞书/QQ/微信）。worker 负责消费消息队列，gateway 负责平台长连接。
  gateway:
    logging: *json-file-logging
    image: ${GUGU_BACKEND_IMAGE:?请设置 GUGU_BACKEND_IMAGE}
    command: ["python", "-m", "agent.gateway.gateway"]
    env_file:
      - ./backend/.env
    environment:
      GUGU_LOG_FILE: /app/logs/gugu-gateway.log
      DB__HOST: ${GUGU_DB_HOST:-postgres}
      DB__PORT: ${GUGU_DB_PORT:-5432}
      DB__NAME: ${GUGU_DB_NAME:-gugu}
      DB__USER: ${GUGU_DB_USER:-gugu}
      DB__PASSWORD: ${GUGU_DB_PASSWORD:?请设置 GUGU_DB_PASSWORD}
      REDIS__HOST: ${GUGU_REDIS_HOST:-redis}
      REDIS__PORT: ${GUGU_REDIS_PORT:-6379}
      REDIS__PASSWORD: ${GUGU_REDIS_PASSWORD:-}
      STORAGE__LOCAL_PATH: /data/users
      GUGU_CONFIG_OVERRIDE_FILE: /config/config.override.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - gugu_data:/data
      - gugu_config:/config
      - gugu_logs:/app/logs
    restart: unless-stopped

  # 一次性引导：沙盒兄弟容器实际运行在 GUGU_DOCKER_SOCKET 指向的 daemon（生产常为
  # rootless），compose 建的网络/容器在 rootful daemon 上对它不可见。此服务确保目标
  # daemon 上有沙盒所需镜像、egress 内部网络与 squid 代理；rootful 单 daemon 部署下
  # 各项已由 compose 提供，脚本自动全部跳过。幂等，每次 up 都会重跑确认。
  sandbox-bootstrap:
    profiles: [sandbox]
    logging: *json-file-logging
    image: ${GUGU_BACKEND_IMAGE:?请设置 GUGU_BACKEND_IMAGE}
    command: ["sh", "/usr/local/bin/gugu-sandbox-init.sh"]
    env_file:
      - ./backend/.env
    environment:
      DOCKER_HOST: unix:///run/gugu/docker.sock
      # 镜像 entrypoint 启动时会先连数据库；给上与 migrate 一致的连接信息。
      DB__HOST: ${GUGU_DB_HOST:-postgres}
      DB__PORT: ${GUGU_DB_PORT:-5432}
      DB__NAME: ${GUGU_DB_NAME:-gugu}
      DB__USER: ${GUGU_DB_USER:-gugu}
      DB__PASSWORD: ${GUGU_DB_PASSWORD:?请设置 GUGU_DB_PASSWORD}
      SANDBOX__IMAGE: ${GUGU_SANDBOX_IMAGE:-debian:bookworm-slim}
      SANDBOX__IMAGE_DIGEST: ${GUGU_SANDBOX_IMAGE_DIGEST:-sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171}
      SANDBOX__EGRESS_PROXY_URL: http://egress-proxy:3128
      SANDBOX__EGRESS_NETWORK_NAME: gugu-sandbox-egress
    volumes:
      - ${GUGU_DOCKER_SOCKET:-/var/run/docker.sock}:/run/gugu/docker.sock
      # 宿主 rootful socket 只读挂载，用于把镜像 save|load 进 rootless daemon；
      # 个别无 rootful daemon 的机器可缺省，脚本退化为直接 pull。
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      - ./squid/egress.conf:/config/squid/egress.conf:ro
      - ./backend/scripts/sandbox_rootless_init.sh:/usr/local/bin/gugu-sandbox-init.sh:ro
    restart: "no"

  sandboxd:
    profiles: [sandbox]
    # 与 backend 共享 host pid namespace，SO_PEERCRED peer 校验才能拿到真实 pid/uid。
    pid: "host"
    logging: *json-file-logging
    # 工具执行随 backend/worker 镜像提供；sandboxd 是按需开启的可选沙盒执行层。
    image: ${GUGU_BACKEND_IMAGE:?请设置 GUGU_BACKEND_IMAGE}
    command: ["python", "-m", "agent.sandbox.sandboxd", "--socket", "/run/gugu/sandboxd.sock", "--allowed-root", "/data/users"]
    env_file:
      - ./backend/.env
    environment:
      DOCKER_HOST: unix:///run/gugu/docker.sock
      DB__HOST: ${GUGU_DB_HOST:-postgres}
      DB__PORT: ${GUGU_DB_PORT:-5432}
      DB__NAME: ${GUGU_DB_NAME:-gugu}
      DB__USER: ${GUGU_DB_USER:-gugu}
      DB__PASSWORD: ${GUGU_DB_PASSWORD:?请设置 GUGU_DB_PASSWORD}
      REDIS__HOST: ${GUGU_REDIS_HOST:-redis}
      REDIS__PORT: ${GUGU_REDIS_PORT:-6379}
      REDIS__PASSWORD: ${GUGU_REDIS_PASSWORD:-}
      STORAGE__LOCAL_PATH: /data/users
      GUGU_SANDBOXD_SOCKET: /run/gugu/sandboxd.sock
      GUGU_CONFIG_OVERRIDE_FILE: /config/config.override.json
      SANDBOX__ENABLED: ${GUGU_SANDBOX_ENABLED:-true}
      SANDBOX__NETWORK_PROFILE: ${GUGU_SANDBOX_NETWORK_PROFILE:-egress}
      SANDBOX__ROOTLESS_REQUIRED: ${GUGU_SANDBOX_ROOTLESS_REQUIRED:-true}
      SANDBOX__EGRESS_PROXY_URL: http://egress-proxy:3128
      SANDBOX__EGRESS_NETWORK_NAME: gugu-sandbox-egress
      SANDBOX__EGRESS_ISOLATION_ENABLED: "true"
    depends_on:
      sandbox-bootstrap:
        condition: service_completed_successfully
        required: false
      migrate:
        condition: service_completed_successfully
    volumes:
      - gugu_data:/data
      - gugu_config:/config
      - sandbox_socket:/run/gugu
      - ${GUGU_DOCKER_SOCKET:-/var/run/docker.sock}:/run/gugu/docker.sock
    restart: unless-stopped

  frontend:
    logging: *json-file-logging
    image: ${GUGU_FRONTEND_IMAGE:?请设置 GUGU_FRONTEND_IMAGE}
    depends_on:
      - backend

  nginx:
    logging: *json-file-logging
    image: nginx:alpine
    ports:
      - "${GUGU_HTTP_PORT:-9595}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  # 用户数据不能用普通 named volume：Shell 沙盒容器由 backend 通过 docker.sock
  # 作为兄弟容器启动，其 --mount src=/data/users/<uid>/shell 由宿主机 daemon 解析，
  # 因此宿主机上必须存在与容器内一致的 /data 路径。这里用 local driver 把
  # GUGU_DATA_HOST_DIR（默认 /data）bind 成同名卷，容器内外路径保持一致。
  # 部署前置：mkdir -p /data，且属主与 rootless docker 用户一致（默认 1001:1001），
  # 否则沙盒容器无法写入；backend 会在创建用户 shell 根目录时放开目录权限。
  gugu_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${GUGU_DATA_HOST_DIR:-/data}
  gugu_config:
  sandbox_socket:
  gugu_logs:

networks:
  egress_internal:
    name: gugu-sandbox-egress
    internal: true
