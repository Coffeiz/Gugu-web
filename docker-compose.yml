# Gugu 默认一键部署：一体化应用镜像（前后端 + worker + gateway）与 PostgreSQL、Redis 等服务。
# 默认启动完整应用；需要 Shell 沙盒时追加：docker compose --profile sandbox up -d

name: gugu-web-compose

x-json-file-logging: &json-file-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-gugu-data-mount: &gugu-data-mount
  type: bind
  source: ${GUGU_DATA_HOST_DIR:-./Gugu-data}
  target: /data
  bind:
    create_host_path: true

x-app-environment: &app-environment
  GUGU_UNIFIED_APP: "1"
  # Compose 有独立 postgres/redis 服务，显式关闭镜像内置依赖（默认 1）。
  GUGU_EMBEDDED_DEPS: "0"
  GUGU_APP_PORT: "8001"
  GUGU_ENABLE_WORKER: "1"
  GUGU_ENABLE_GATEWAY: "1"
  GUGU_ENV_FILE: /app/.env
  GUGU_DATA_DIR: /data
  # 用于启动失败时生成宿主机侧可执行的目录修复提示；实际挂载仍由 x-gugu-data-mount 控制。
  GUGU_DATA_HOST_DIR: ${GUGU_DATA_HOST_DIR:-${PWD}/Gugu-data}
  SECRET_KEY: ${SECRET_KEY:-}
  GUGU_DB_PASSWORD: ${GUGU_DB_PASSWORD:-}
  DB__PASSWORD: ${GUGU_DB_PASSWORD:-}
  DB__HOST: postgres
  DB__PORT: 5432
  DB__NAME: ${GUGU_DB_NAME:-gugu}
  DB__USER: ${GUGU_DB_USER:-gugu}
  REDIS__HOST: redis
  REDIS__PORT: 6379
  REDIS__PASSWORD: ${GUGU_REDIS_PASSWORD:-}
  PUBLIC_APP_URL: ${GUGU_PUBLIC_APP_URL:-http://localhost:9595}
  STORAGE__LOCAL_PATH: /data/users
  CREDENTIALS_MASTER_KEY_FILE: /data/byok/.byok-master-key
  GUGU_CONFIG_OVERRIDE_FILE: /config/config.override.json
  SEARCH__SEARXNG_URL: http://searxng:8080
  GUGU_LOG_FILE: /app/logs/gugu.log
  # 仅 profile sandbox 实际提供 sandboxd；未启用时 Shell 探测会保持不可用。
  SANDBOX__ENABLED: ${GUGU_SANDBOX_ENABLED:-true}
  SANDBOX__NETWORK_PROFILE: ${GUGU_SANDBOX_NETWORK_PROFILE:-egress}
  SANDBOX__IMAGE: ${GUGU_SANDBOX_IMAGE:-debian:bookworm-slim}
  SANDBOX__IMAGE_DIGEST: ${GUGU_SANDBOX_IMAGE_DIGEST:-sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171}
  SANDBOX__EGRESS_PROXY_URL: http://egress-proxy:3128
  SANDBOX__EGRESS_NETWORK_NAME: ${GUGU_SANDBOX_EGRESS_NETWORK_NAME:-gugu-sandbox-egress}
  SANDBOX__HOST_DATA_ROOT: ${GUGU_DATA_HOST_DIR:-${PWD}/Gugu-data}/users
  SANDBOX__EGRESS_ISOLATION_ENABLED: "true"
  GUGU_SANDBOXD_SOCKET: /run/gugu/sandboxd.sock

services:
  postgres:
    image: postgres:18
    logging: *json-file-logging
    environment:
      POSTGRES_USER: ${GUGU_DB_USER:-gugu}
      POSTGRES_PASSWORD: ${GUGU_DB_PASSWORD:-}
      POSTGRES_DB: ${GUGU_DB_NAME:-gugu}
    volumes:
      # PostgreSQL 18 使用 /var/lib/postgresql/<major>/docker 数据布局；挂载父目录
      # 才能让官方镜像正确处理后续 pg_upgrade。
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:latest
    logging: *json-file-logging
    # IM 入站消息先进入 Redis Stream；AOF 每秒刷盘，容器重建后可从持久卷恢复未完成队列。
    command: ["sh", "-c", "if [ -n \"$${GUGU_REDIS_PASSWORD}\" ]; then exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$${GUGU_REDIS_PASSWORD}\"; else exec redis-server --appendonly yes --appendfsync everysec; fi"]
    environment:
      GUGU_REDIS_PASSWORD: ${GUGU_REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${GUGU_REDIS_PASSWORD}\" ]; then redis-cli -a \"$${GUGU_REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    logging: *json-file-logging
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080/}
      UWSGI_WORKERS: 2
      UWSGI_THREADS: 4
    mem_limit: 512m
    restart: unless-stopped

  app:
    image: ${GUGU_WEB_IMAGE:-coffeiz/gugu-web:latest}
    logging: *json-file-logging
    ports:
      - "${GUGU_HTTP_PORT:-9595}:9595"
    # 首次使用前创建宿主配置文件：mkdir -p backend && touch backend/.env
    # 该文件保存首次启动生成的密钥和管理员密码；应用镜像本身不携带用户配置。
    # 自更新（PRD-ADMIN-2 §1.1）：执行器并入 app 进程，socket 默认挂载；
    # GUGU_SELF_UPDATE=off 显式关闭（也可配合 override 删掉 socket 挂载）。
    environment:
      <<: *app-environment
      GUGU_SELF_UPDATE: ${GUGU_SELF_UPDATE:-on}
      GUGU_UPDATER_COMPOSE_DIR: ${GUGU_UPDATER_COMPOSE_DIR:-${PWD}}
      GUGU_UPDATER_STATE_DIR: ${GUGU_UPDATER_STATE_DIR:-/data/updater}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ./backend/.env:/app/.env
      - *gugu-data-mount
      - gugu_config:/config
      - gugu_logs:/app/logs
      - sandbox_socket:/run/gugu
      - ${GUGU_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${GUGU_UPDATER_COMPOSE_DIR:-${PWD}}:${GUGU_UPDATER_COMPOSE_DIR:-${PWD}}:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9595/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  egress-proxy:
    profiles: [sandbox]
    image: ubuntu/squid:latest
    logging: *json-file-logging
    volumes:
      - ./squid/egress.conf:/etc/squid/squid.conf:ro
    networks:
      - default
      - egress_internal
    restart: unless-stopped

  sandbox-bootstrap:
    profiles: [sandbox]
    image: ${GUGU_WEB_IMAGE:-coffeiz/gugu-web:latest}
    logging: *json-file-logging
    entrypoint: []
    command: ["sh", "/usr/local/bin/gugu-sandbox-init.sh"]
    environment:
      DOCKER_HOST: unix:///run/gugu/docker.sock
      SANDBOX__IMAGE: ${GUGU_SANDBOX_IMAGE:-debian:bookworm-slim}
      SANDBOX__IMAGE_DIGEST: ${GUGU_SANDBOX_IMAGE_DIGEST:-sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171}
      SANDBOX__EGRESS_PROXY_URL: http://egress-proxy:3128
      SANDBOX__EGRESS_NETWORK_NAME: ${GUGU_SANDBOX_EGRESS_NETWORK_NAME:-gugu-sandbox-egress}
      SQUID_CONF_PATH: /opt/gugu/egress.conf
      SANDBOX__HOST_DATA_ROOT: ${GUGU_DATA_HOST_DIR:-${PWD}/Gugu-data}/users
    volumes:
      - sandbox_socket:/run/gugu
      - ${GUGU_DOCKER_SOCKET:-/var/run/docker.sock}:/run/gugu/docker.sock
      - *gugu-data-mount
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/subuid:/host/etc/subuid:ro
      - /etc/subgid:/host/etc/subgid:ro
    depends_on:
      egress-proxy:
        condition: service_started
    restart: "no"

  sandboxd:
    profiles: [sandbox]
    image: ${GUGU_SANDBOXD_IMAGE:-${GUGU_WEB_IMAGE:-coffeiz/gugu-web:latest}}
    logging: *json-file-logging
    pid: "host"
    # sandboxd 不是 web 服务，不应进入默认 Compose 的数据库迁移/worker 入口。
    entrypoint: []
    command: ["python", "-m", "agent.sandbox.sandboxd", "--socket", "/run/gugu/sandboxd.sock", "--allowed-root", "/data/users"]
    # 该镜像默认 healthcheck 探测 9595，sandboxd 不提供 HTTP 服务，不能沿用该检查。
    healthcheck:
      disable: true
    environment:
      DOCKER_HOST: unix:///run/gugu/docker.sock
      STORAGE__LOCAL_PATH: /data/users
      GUGU_SANDBOXD_SOCKET: /run/gugu/sandboxd.sock
      SANDBOX__ENABLED: "true"
      SANDBOX__NETWORK_PROFILE: ${GUGU_SANDBOX_NETWORK_PROFILE:-egress}
      SANDBOX__IMAGE: ${GUGU_SANDBOX_IMAGE:-debian:bookworm-slim}
      SANDBOX__IMAGE_DIGEST: ${GUGU_SANDBOX_IMAGE_DIGEST:-sha256:88200866dfff7ea7f5cbcb6ec7c8a701889fe64d6990e4b07ea4171}
      SANDBOX__EGRESS_PROXY_URL: http://egress-proxy:3128
      SANDBOX__EGRESS_NETWORK_NAME: ${GUGU_SANDBOX_EGRESS_NETWORK_NAME:-gugu-sandbox-egress}
      SANDBOX__EGRESS_ISOLATION_ENABLED: "true"
    volumes:
      - *gugu-data-mount
      - gugu_config:/config
      - sandbox_socket:/run/gugu
      - ${GUGU_DOCKER_SOCKET:-/var/run/docker.sock}:/run/gugu/docker.sock
    depends_on:
      sandbox-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  gugu_config:
  gugu_logs:
  sandbox_socket:

networks:
  egress_internal:
    name: ${GUGU_SANDBOX_EGRESS_NETWORK_NAME:-gugu-sandbox-egress}
    internal: true
