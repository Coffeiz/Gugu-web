# Gugu 默认一键部署：单容器应用（Nginx + Uvicorn + worker + IM gateway）+ PostgreSQL + Redis。
# 默认启动完整应用；需要 Shell 沙盒时追加：docker compose --profile sandbox up -d

name: gugu-web-compose

x-json-file-logging: &json-file-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-gugu-data-mount: &gugu-data-mount
  type: bind
  source: ${GUGU_DATA_HOST_DIR:-./Gugu-data}
  target: /data
  bind:
    create_host_path: true

x-app-environment: &app-environment
  GUGU_SINGLE_CONTAINER: "1"
  GUGU_APP_PORT: "8001"
  GUGU_ENABLE_WORKER: "1"
  GUGU_ENABLE_GATEWAY: "1"
  GUGU_ENV_FILE: /app/.env
  GUGU_DATA_DIR: /data
  SECRET_KEY: ${SECRET_KEY:-}
  GUGU_DB_PASSWORD: ${GUGU_DB_PASSWORD:-}
  DB__PASSWORD: ${GUGU_DB_PASSWORD:-}
  DB__HOST: postgres
  DB__PORT: 5432
  DB__NAME: ${GUGU_DB_NAME:-gugu}
  DB__USER: ${GUGU_DB_USER:-gugu}
  REDIS__HOST: redis
  REDIS__PORT: 6379
  REDIS__PASSWORD: ${GUGU_REDIS_PASSWORD:-}
  PUBLIC_APP_URL: ${GUGU_PUBLIC_APP_URL:-http://localhost:9595}
  STORAGE__LOCAL_PATH: /data/users
  CREDENTIALS_MASTER_KEY_FILE: /data/byok/.byok-master-key
  GUGU_CONFIG_OVERRIDE_FILE: /config/config.override.json
  SEARCH__SEARXNG_URL: http://searxng:8080
  GUGU_LOG_FILE: /app/logs/gugu.log
  # 仅 profile sandbox 实际提供 sandboxd；未启用时 Shell 探测会保持不可用。
  SANDBOX__ENABLED: ${GUGU_SANDBOX_ENABLED:-true}
  SANDBOX__NETWORK_PROFILE: ${GUGU_SANDBOX_NETWORK_PROFILE:-egress}
  SANDBOX__EGRESS_PROXY_URL: http://egress-proxy:3128
  SANDBOX__EGRESS_NETWORK_NAME: ${GUGU_SANDBOX_EGRESS_NETWORK_NAME:-gugu-sandbox-egress}
  SANDBOX__HOST_DATA_ROOT: ${GUGU_DATA_HOST_DIR:-${PWD}/Gugu-data}/users
  SANDBOX__EGRESS_ISOLATION_ENABLED: "true"
  GUGU_SANDBOXD_SOCKET: /run/gugu/sandboxd.sock
  DOCKER_HOST: unix:///run/gugu/docker.sock

services:
  postgres:
    image: postgres:18
    logging: *json-file-logging
    environment:
      POSTGRES_USER: ${GUGU_DB_USER:-gugu}
      POSTGRES_PASSWORD: ${GUGU_DB_PASSWORD:-}
      POSTGRES_DB: ${GUGU_DB_NAME:-gugu}
    volumes:
      # PostgreSQL 18 使用 /var/lib/postgresql/<major>/docker 数据布局；挂载父目录
      # 才能让官方镜像正确处理后续 pg_upgrade。
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:latest
    logging: *json-file-logging
    command: ["sh", "-c", "if [ -n \"$${GUGU_REDIS_PASSWORD}\" ]; then exec redis-server --requirepass \"$${GUGU_REDIS_PASSWORD}\"; else exec redis-server; fi"]
    environment:
      GUGU_REDIS_PASSWORD: ${GUGU_REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${GUGU_REDIS_PASSWORD}\" ]; then redis-cli -a \"$${GUGU_REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    logging: *json-file-logging
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080/}
      UWSGI_WORKERS: 2
      UWSGI_THREADS: 4
    mem_limit: 512m
    restart: unless-stopped

  # v1.0.6 起用户数据使用宿主机 Gugu-data。旧版本若使用 named volume，
  # 先由这个一次性服务复制到新目录；源卷只读且永不自动删除，重复执行安全。
  data-migrate:
    image: ${GUGU_WEB_IMAGE:-coffeiz/gugu-web:latest}
    entrypoint: []
    command: ["python", "scripts/migrate_storage_root.py", "--source", "/legacy", "--target", "/data", "--apply", "--no-config-update"]
    volumes:
      - legacy_gugu_data:/legacy:ro
      - *gugu-data-mount
    restart: "no"

  app:
    image: ${GUGU_WEB_IMAGE:-coffeiz/gugu-web:latest}
    logging: *json-file-logging
    ports:
      - "${GUGU_HTTP_PORT:-9595}:8000"
    environment: *app-environment
    # 首次使用前创建宿主配置文件：mkdir -p backend && touch backend/.env
    # 该文件只保存随机管理员密码；应用镜像本身不携带用户配置。
    volumes:
      - ./backend/.env:/app/.env
      - *gugu-data-mount
      - gugu_config:/config
      - gugu_logs:/app/logs
      - sandbox_socket:/run/gugu
      - ${GUGU_DOCKER_SOCKET:-/var/run/docker.sock}:/run/gugu/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
      data-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  egress-proxy:
    profiles: [sandbox]
    image: ubuntu/squid:latest
    logging: *json-file-logging
    volumes:
      - ./squid/egress.conf:/etc/squid/squid.conf:ro
    networks:
      - default
      - egress_internal
    restart: unless-stopped

  sandbox-bootstrap:
    profiles: [sandbox]
    image: ${GUGU_WEB_IMAGE:-coffeiz/gugu-web:latest}
    logging: *json-file-logging
    entrypoint: []
    command: ["sh", "/usr/local/bin/gugu-sandbox-init.sh"]
    environment:
      DOCKER_HOST: unix:///run/gugu/docker.sock
      SANDBOX__IMAGE: ${SANDBOX__IMAGE:-debian:bookworm-slim}
      SANDBOX__IMAGE_DIGEST: ${SANDBOX__IMAGE_DIGEST:-sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171}
      SANDBOX__EGRESS_PROXY_URL: http://egress-proxy:3128
      SANDBOX__EGRESS_NETWORK_NAME: ${GUGU_SANDBOX_EGRESS_NETWORK_NAME:-gugu-sandbox-egress}
      SQUID_CONF_PATH: /opt/gugu/egress.conf
    volumes:
      - ${GUGU_DOCKER_SOCKET:-/var/run/docker.sock}:/run/gugu/docker.sock
    depends_on:
      - egress-proxy
    restart: "no"

  sandboxd:
    profiles: [sandbox]
    image: ${GUGU_WEB_IMAGE:-coffeiz/gugu-web:latest}
    logging: *json-file-logging
    pid: "host"
    # sandboxd 不是 web 服务，不应进入默认 Compose 的数据库迁移/worker 入口。
    entrypoint: []
    command: ["python", "-m", "agent.sandbox.sandboxd", "--socket", "/run/gugu/sandboxd.sock", "--allowed-root", "/data/users"]
    # 该镜像默认 healthcheck 探测 8000，sandboxd 不提供 HTTP 服务，不能沿用该检查。
    healthcheck:
      disable: true
    environment:
      DOCKER_HOST: unix:///run/gugu/docker.sock
      STORAGE__LOCAL_PATH: /data/users
      GUGU_SANDBOXD_SOCKET: /run/gugu/sandboxd.sock
      SANDBOX__ENABLED: "true"
      SANDBOX__NETWORK_PROFILE: ${GUGU_SANDBOX_NETWORK_PROFILE:-egress}
      SANDBOX__IMAGE: ${SANDBOX__IMAGE:-debian:bookworm-slim}
      SANDBOX__IMAGE_DIGEST: ${SANDBOX__IMAGE_DIGEST:-sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171}
      SANDBOX__EGRESS_PROXY_URL: http://egress-proxy:3128
      SANDBOX__EGRESS_NETWORK_NAME: ${GUGU_SANDBOX_EGRESS_NETWORK_NAME:-gugu-sandbox-egress}
      SANDBOX__EGRESS_ISOLATION_ENABLED: "true"
    volumes:
      - *gugu-data-mount
      - gugu_config:/config
      - sandbox_socket:/run/gugu
      - ${GUGU_DOCKER_SOCKET:-/var/run/docker.sock}:/run/gugu/docker.sock
    depends_on:
      sandbox-bootstrap:
        condition: service_completed_successfully
      data-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  legacy_gugu_data:
    # 自定义 Compose project name 的旧部署请显式设置 GUGU_LEGACY_DATA_VOLUME。
    name: ${GUGU_LEGACY_DATA_VOLUME:-gugu-web-compose_gugu_data}
  gugu_config:
  gugu_logs:
  sandbox_socket:

networks:
  egress_internal:
    name: ${GUGU_SANDBOX_EGRESS_NETWORK_NAME:-gugu-sandbox-egress}
    internal: true
