<svg viewBox="0 0 680 640" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif">
<title>咕咕 · Person Model / Relationship 闭环架构（含反馈信号系统）</title>
<desc>五层自上而下：Goal、Relationship（含关系温度）、Person Model、Current Context、Need Hypothesis，下接 Behavior→Response，再往下是反馈信号采集（显式+隐式），反馈经写协议回写到上面所有层构成闭环。上三层为稳定身份（紫），下两层为易变状态（蓝）。右侧标注时间纪律。</desc>
<defs>
<marker id="arrow-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.6"/></marker>
<marker id="arrow-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6"/></marker>
</defs>

<rect width="680" height="640" fill="#FFFFFF"/>

<text x="340" y="28" text-anchor="middle" font-family="Georgia, 'Songti SC', serif" font-size="18" font-weight="600" fill="#2C2C2A">咕咕 · Person Model / Relationship 闭环</text>
<text x="340" y="47" text-anchor="middle" font-size="11.5" fill="#888780">学习对象是「人」，最终是「关系」 · 需求只是导出量 · 燃料是反馈信号</text>

<!-- 稳定身份层（紫） -->
<rect x="235" y="64" width="270" height="46" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
<text x="370" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#26215C">Goal（永不变）</text>
<text x="370" y="101" text-anchor="middle" font-size="10.5" fill="#534AB7">不断理解这个人</text>

<rect x="235" y="126" width="270" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
<text x="370" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#26215C">Relationship（我们）</text>
<text x="370" y="162" text-anchor="middle" font-size="10.5" fill="#534AB7">共同经历 · 默契 · 信任</text>
<text x="370" y="176" text-anchor="middle" font-size="9.5" fill="#7F77DD">+ 温度（快变·窗口冷却·有上限）× 深度（慢变·只增）→ 语气定档</text>

<rect x="235" y="198" width="270" height="46" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
<text x="370" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#26215C">Person Model（你）</text>
<text x="370" y="235" text-anchor="middle" font-size="9.5" fill="#534AB7">Observation 全是假设 · trait 读时派生（检索=前置基建）</text>

<!-- 易变状态层（蓝） -->
<rect x="235" y="260" width="270" height="46" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
<text x="370" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#042C53">Current Context（现在）</text>
<text x="370" y="297" text-anchor="middle" font-size="10.5" fill="#185FA5">项目 · 情绪 · 事件</text>

<rect x="235" y="322" width="270" height="46" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
<text x="370" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#042C53">Need Hypothesis（此刻）</text>
<text x="370" y="359" text-anchor="middle" font-size="9.5" fill="#185FA5">我猜你需要 X + 置信度（现行 stance 是它的过渡态）</text>

<!-- 行为/输出 -->
<rect x="235" y="390" width="270" height="40" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
<text x="370" y="415" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2C2C2A">Behavior → Response</text>

<!-- 反馈信号盒（加宽的燃料层） -->
<rect x="150" y="456" width="440" height="94" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.4"/>
<text x="370" y="475" text-anchor="middle" font-size="12" font-weight="700" fill="#993C1D">反馈信号（学习闭环的燃料 · 枚举采集搭反思车）</text>
<text x="168" y="495" font-size="10.5" font-weight="600" fill="#712B13">显式（高置信·低频）</text>
<text x="168" y="510" font-size="9.5" fill="#993C1D">· 纠正（已采,错读收集器）</text>
<text x="168" y="524" font-size="9.5" fill="#993C1D">· 确认/夸赞（补采 = 印证↑）</text>
<text x="168" y="540" font-size="9" fill="#B8663F">单条不动模型:N 次同向才写</text>
<text x="382" y="495" font-size="10.5" font-weight="600" fill="#712B13">隐式（高频 · 写协议兜噪声）</text>
<text x="382" y="510" font-size="9.5" fill="#993C1D">· 改写重问（反驳↓） · 顺着聊 / 无视跳开</text>
<text x="382" y="524" font-size="9.5" fill="#993C1D">· 主动分享 · 会话深度 · 回访节奏</text>
<text x="382" y="540" font-size="9" fill="#B8663F">└ 周聚合 → 关系温度</text>

<!-- 向下箭头 -->
<line x1="370" y1="110" x2="370" y2="124" stroke="#888780" stroke-width="1.6" marker-end="url(#arrow-n)"/>
<line x1="370" y1="182" x2="370" y2="196" stroke="#888780" stroke-width="1.6" marker-end="url(#arrow-n)"/>
<line x1="370" y1="244" x2="370" y2="258" stroke="#888780" stroke-width="1.6" marker-end="url(#arrow-n)"/>
<line x1="370" y1="306" x2="370" y2="320" stroke="#888780" stroke-width="1.6" marker-end="url(#arrow-n)"/>
<line x1="370" y1="368" x2="370" y2="388" stroke="#888780" stroke-width="1.6" marker-end="url(#arrow-n)"/>
<line x1="370" y1="430" x2="370" y2="454" stroke="#888780" stroke-width="1.6" marker-end="url(#arrow-n)"/>

<!-- 闭环：反馈回写 -->
<path d="M 150 503 C 70 503 42 470 42 420 L 42 190 C 42 158 130 154 233 154" fill="none" stroke="#D85A30" stroke-width="2.4" marker-end="url(#arrow-c)"/>
<text x="52" y="252" font-size="12" font-weight="700" fill="#993C1D">回写 · 写协议</text>
<text x="52" y="270" font-size="10" fill="#5F5E5A">假设→证据→置信</text>
<text x="52" y="284" font-size="10" fill="#5F5E5A">→衰减→可推翻</text>
<text x="52" y="304" font-size="10.5" font-style="italic" fill="#D85A30">「不要相信自己」</text>
<text x="52" y="324" font-size="9.5" fill="#888780">lens 印证 / 反驳</text>
<text x="52" y="338" font-size="9.5" fill="#888780">关系温度聚合</text>

<!-- 需求公式 -->
<line x1="505" y1="345" x2="518" y2="345" stroke="#185FA5" stroke-width="1.3"/>
<text x="522" y="341" font-size="10" fill="#5F5E5A">需求 =</text>
<text x="522" y="356" font-size="10.5" font-weight="700" fill="#042C53">人 × 当下情境</text>

<!-- 时间纪律注（右上，紧贴 Relationship/Person 层） -->
<rect x="528" y="120" width="136" height="128" rx="9" fill="#FFFFFF" stroke="#C9943A" stroke-width="1.2"/>
<text x="596" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#854F0B">⏱ 时间纪律</text>
<text x="538" y="158" font-size="9.5" fill="#5F5E5A">所有层带时间戳;</text>
<text x="538" y="172" font-size="9.5" fill="#5F5E5A">时长由系统算好注入</text>
<text x="538" y="186" font-size="9.5" fill="#5F5E5A">（「认识 N 天」），</text>
<text x="538" y="202" font-size="9.5" font-weight="600" fill="#854F0B">禁模型自估时长——</text>
<text x="538" y="218" font-size="9.5" fill="#5F5E5A">「这几个月」这类无据</text>
<text x="538" y="232" font-size="9.5" fill="#5F5E5A">时间词 = 假亲密，同罪</text>

<!-- 图例 -->
<circle cx="180" cy="578" r="5" fill="#534AB7"/>
<text x="191" y="582" font-size="10.5" fill="#5F5E5A">稳 · 身份（慢衰减）</text>
<circle cx="330" cy="578" r="5" fill="#185FA5"/>
<text x="341" y="582" font-size="10.5" fill="#5F5E5A">变 · 状态（快衰减）</text>
<circle cx="480" cy="578" r="5" fill="#D85A30"/>
<text x="491" y="582" font-size="10.5" fill="#5F5E5A">反馈 · 燃料（写协议）</text>

<text x="42" y="608" font-size="9.5" fill="#888780">现状 = 「按需相处」一臂（stance 分类器,过渡态）+ 错读收集器;反馈信号系统 = 下一步（proposals/反馈信号系统-设计.md）;</text>
<text x="42" y="622" font-size="9.5" fill="#888780">其余（Person Model / 置信度 / Relationship）按数据自下而上长，绝不 top-down 画表去填</text>
</svg>
