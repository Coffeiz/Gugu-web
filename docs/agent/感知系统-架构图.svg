<svg viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif">
<title>咕咕 Person Model / Relationship 闭环架构</title>
<desc>五层自上而下：Goal、Relationship、Person Model、Current Context、Need Hypothesis，下接 Behavior→Response→Feedback，反馈经写协议回写到上面所有层，构成闭环。上三层为稳定身份（紫），下两层为易变状态（蓝）。</desc>
<defs>
<marker id="arrow-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.6"/></marker>
<marker id="arrow-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6"/></marker>
</defs>

<rect width="680" height="540" fill="#FFFFFF"/>

<text x="340" y="30" text-anchor="middle" font-family="Georgia, 'Songti SC', serif" font-size="18" font-weight="600" fill="#2C2C2A">咕咕 · Person Model / Relationship 闭环</text>
<text x="340" y="50" text-anchor="middle" font-size="11.5" fill="#888780">学习对象是「人」，最终是「关系」 · 需求只是导出量</text>

<rect x="235" y="72" width="270" height="48" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
<text x="370" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#26215C">Goal（永不变）</text>
<text x="370" y="110" text-anchor="middle" font-size="10.5" fill="#534AB7">不断理解这个人</text>

<rect x="235" y="138" width="270" height="48" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
<text x="370" y="159" text-anchor="middle" font-size="13" font-weight="700" fill="#26215C">Relationship（我们）</text>
<text x="370" y="176" text-anchor="middle" font-size="10.5" fill="#534AB7">共同经历 · 默契 · 信任</text>

<rect x="235" y="204" width="270" height="48" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
<text x="370" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#26215C">Person Model（你）</text>
<text x="370" y="242" text-anchor="middle" font-size="10.5" fill="#534AB7">Observation，全是假设</text>

<rect x="235" y="270" width="270" height="48" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
<text x="370" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#042C53">Current Context（现在）</text>
<text x="370" y="308" text-anchor="middle" font-size="10.5" fill="#185FA5">项目 · 情绪 · 事件</text>

<rect x="235" y="336" width="270" height="48" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
<text x="370" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#042C53">Need Hypothesis（此刻）</text>
<text x="370" y="374" text-anchor="middle" font-size="10.5" fill="#185FA5">我猜你需要 X · 置信度</text>

<rect x="235" y="410" width="270" height="44" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
<text x="370" y="437" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2C2C2A">Behavior → Response → Feedback</text>

<line x1="370" y1="120" x2="370" y2="136" stroke="#888780" stroke-width="1.6" marker-end="url(#arrow-n)"/>
<line x1="370" y1="186" x2="370" y2="202" stroke="#888780" stroke-width="1.6" marker-end="url(#arrow-n)"/>
<line x1="370" y1="252" x2="370" y2="268" stroke="#888780" stroke-width="1.6" marker-end="url(#arrow-n)"/>
<line x1="370" y1="318" x2="370" y2="334" stroke="#888780" stroke-width="1.6" marker-end="url(#arrow-n)"/>
<line x1="370" y1="384" x2="370" y2="408" stroke="#888780" stroke-width="1.6" marker-end="url(#arrow-n)"/>

<path d="M 235 432 C 130 432 50 406 50 360 L 50 182 C 50 152 130 162 233 162" fill="none" stroke="#D85A30" stroke-width="2.4" marker-end="url(#arrow-c)"/>
<text x="62" y="250" font-size="12" font-weight="700" fill="#993C1D">回写 · Feedback</text>
<text x="62" y="267" font-size="10" fill="#5F5E5A">经「写协议」更新模型</text>
<text x="62" y="287" font-size="10.5" font-style="italic" fill="#D85A30">「不要相信自己」</text>
<text x="62" y="305" font-size="9.5" fill="#888780">假设→证据→置信→衰减→可推翻</text>

<line x1="505" y1="360" x2="520" y2="360" stroke="#185FA5" stroke-width="1.3"/>
<text x="524" y="356" font-size="10.5" fill="#5F5E5A">需求 =</text>
<text x="524" y="372" font-size="11" font-weight="700" fill="#042C53">人 × 当下情境</text>

<circle cx="243" cy="480" r="5" fill="#534AB7"/>
<text x="254" y="484" font-size="10.5" fill="#5F5E5A">稳 · 身份（慢衰减）</text>
<circle cx="392" cy="480" r="5" fill="#185FA5"/>
<text x="403" y="484" font-size="10.5" fill="#5F5E5A">变 · 状态（快衰减）</text>

<text x="50" y="512" font-size="9.5" fill="#888780">v0.6 已落 = 仅「按需相处」一臂；其余（Person Model / 置信度 / 误判回写 / Relationship）按数据自下而上长</text>
</svg>
