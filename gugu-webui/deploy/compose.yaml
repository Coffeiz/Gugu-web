services:
  gugu-webui:
    build:
      context: ../..
      dockerfile: gugu-webui/deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      GUGU_WEBUI_HOST: 0.0.0.0
      GUGU_WEBUI_PORT: 9595
      GUGU_CONFIG_OVERRIDE_FILE: /data/config.override.json
    ports:
      - "${GUGU_WEBUI_PUBLISHED_PORT:-9595}:9595"
    volumes:
      - gugu-webui-config:/data

volumes:
  gugu-webui-config:
