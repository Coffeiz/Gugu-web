services:
  backend:
    build: ./backend
    environment:
      LOOPSCOPE_HOST: 0.0.0.0
      LOOPSCOPE_PORT: 4320
      LOOPSCOPE_DB_PATH: /data/loopscope.db
    ports:
      - "4320:4320"
    volumes:
      - loopscope-data:/data

  frontend:
    build: ./frontend
    environment:
      VITE_LOOPSCOPE_API_URL: http://127.0.0.1:4320/api
    ports:
      - "4319:4319"
    depends_on:
      - backend

volumes:
  loopscope-data:
