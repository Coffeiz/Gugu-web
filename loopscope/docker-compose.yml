services:
  backend:
    build:
      context: .
      dockerfile: apps/collector/Dockerfile
    environment:
      LOOPSCOPE_HOST: 0.0.0.0
      LOOPSCOPE_PORT: 4320
      LOOPSCOPE_DB_PATH: /data/loopscope.db
    ports:
      - "127.0.0.1:4320:4320"
    volumes:
      - loopscope-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4320/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    environment:
      GUGU_API_TARGET: "${GUGU_API_TARGET:-http://host.docker.internal:8000}"
    ports:
      - "4319:4319"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  loopscope-data:
