events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    client_max_body_size 512m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    include /etc/nginx/conf.d/admin-entry-http.conf;
    include /etc/nginx/conf.d/admin-host-http.conf;

    server {
        listen 9595;
        server_name _;
        root /app/static;
        index index.html;
        error_page 404 /404.html;

        location = /404.html {
            internal;
        }

        location = /health {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /api/v1/admin {
            if ($gugu_admin_host_ok = 0) { return 404; }
            if ($gugu_admin_entry_ok = 0) { return 404; }
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            # 保留客户端 Host 中的显式端口，供 Cookie WebSocket 同源校验使用。
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location = /admin {
            if ($gugu_admin_host_ok = 0) { return 404; }
            if ($gugu_admin_entry_ok = 0) { return 404; }
            return 301 /admin/;
        }

        include /etc/nginx/conf.d/admin-entry-server.conf;

        # Vite hash 资源可以长期缓存；缺失时返回 404，不能回退为 SPA HTML。
        location ^~ /admin/assets/ {
            if ($gugu_admin_host_ok = 0) { return 404; }
            if ($gugu_admin_entry_ok = 0) { return 404; }
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # SPA 入口必须重新验证，避免发版后继续引用旧 hash 资源。
        location = /admin/index.html {
            if ($gugu_admin_host_ok = 0) { return 404; }
            if ($gugu_admin_entry_ok = 0) { return 404; }
            try_files $uri =404;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        location /admin/ {
            if ($gugu_admin_host_ok = 0) { return 404; }
            if ($gugu_admin_entry_ok = 0) { return 404; }
            try_files $uri $uri/ /admin/index.html;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # 字体是静态二进制资源；缺失时必须返回 404，不能被 SPA 回退成 index.html。
        location ^~ /fonts/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
