events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    include /etc/nginx/conf.d/admin-entry-http.conf;

    sendfile on;
    client_max_body_size 512m;

    # Docker embedded DNS：容器重建后服务 IP 变化时自动重新解析，避免 Nginx
    # 继续使用旧容器地址导致 API 502。
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        set $gugu_backend backend:8000;
        set $gugu_frontend frontend:80;

        include /etc/nginx/conf.d/admin-entry-server.conf;

        location ^~ /api/v1/admin {
            if ($gugu_admin_entry_ok = 0) { return 404; }
            proxy_pass http://$gugu_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://$gugu_backend;
            proxy_http_version 1.1;
            # 保留客户端 Host 中的显式端口，供 Cookie WebSocket 同源校验使用。
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location = /admin {
            if ($gugu_admin_entry_ok = 0) { return 404; }
            return 301 /admin/;
        }

        location /admin/ {
            if ($gugu_admin_entry_ok = 0) { return 404; }
            proxy_pass http://$gugu_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://$gugu_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
