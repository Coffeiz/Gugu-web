packages:
  - "frontend"
  - "loopscope/frontend"
  - "loopscope/apps/*"
  - "loopscope/packages/*"
  - "backend/ts/packages/*"
  - "backend/ts/workers/*"
  - "backend/ts"
# pnpm 10+ 默认禁止依赖跑安装脚本；pnpm 12 用 allowBuilds 显式放行（布尔值）。
# 这三个包需要编译/装平台二进制：better-sqlite3(node-gyp)、esbuild(平台二进制)、vue-demi(接口切换)。
allowBuilds:
  better-sqlite3: true
  esbuild: true
  vue-demi: true

overrides:
  '@vitest/mocker': 4.1.12
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  dompurify: 3.4.17
  esbuild@0.18.20: 0.25.12
  fast-uri: 3.1.8
  follow-redirects: 1.16.1
  js-yaml: 4.3.2
  katex: 0.18.2
  qs: 6.16.0
  source-map-js: 1.2.2
  undici: 7.29.1
